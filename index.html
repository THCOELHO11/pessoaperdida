let persistTimer;
function displayNameFor(ficha){
  if(state.view==='gform') return guiaVictimName(ficha.data) || 'Nova guia';
  return ficha.data.nomeVitima || 'Nova ficha';
}
function persist(ficha){
  ficha.updatedAt = new Date().toISOString();
  CUR_STORE.upsert(ficha);
  const tag = document.getElementById('savedtag');
  const fname = document.querySelector('#formbar .fname');
  if(fname) fname.textContent = displayNameFor(ficha);
  if(tag){
    tag.textContent = 'Salvo';
    clearTimeout(persistTimer);
    persistTimer = setTimeout(()=>{ if(tag) tag.textContent=''; }, 1500);
  }
}


/* =========================================================
   Guia de Comando → Questionário (cópia única dos campos em comum)
   Depois de criado, o questionário é independente da guia.
   ========================================================= */
function guiaToQuestionario(g){
  const q = {};
  const has = v => v!==undefined && v!==null && String(v).trim()!=='';
  const put = (k, v)=>{ if(has(v)) q[k] = typeof v==='string' ? v.trim() : v; };
  const yes = (detail)=>({val:'sim', detail: detail||''});
  const join = (arr, sep)=> arr.filter(has).map(x=>String(x).trim()).join(sep||' · ');

  const mental = gArr(g.mental), fatores = gArr(g.fatores), eq = gArr(g.equipamento);
  const criancas = gArr(g.criancas), docs = gArr(g.docs);

  /* identificação e descrição */
  put('nomeVitima', g.nomeCompleto || g.nomeIdade);
  put('idade', g.idade);
  put('genero', g.sexo);
  put('altura', g.alturaCompleicao);
  put('corTamCabelo', g.cabeloBarba);
  put('descricaoBasica', g.sinais);
  put('entrevistador', g.investigadoPor);

  const cat = guiaCategoriaTexto(g);
  put('categoriaVitima', cat);
  put('perfilIdentificado', cat);

  /* condição mental / criança / atividade */
  put('condicaoMental', join(mental.concat(criancas), '; '));
  const idadeNum = parseInt(g.idade, 10);
  if(criancas.length) q.crianca = yes(g.idade || criancas[0]);
  else if(isFinite(idadeNum)) q.crianca = idadeNum<=15 ? yes(String(idadeNum)) : {val:'nao', detail:''};

  const ativs = gArr(g.atividade).filter(a=>a!=='Outra').concat(has(g.atividadeOutra)?[g.atividadeOutra]:[]);
  if(ativs.length) q.atividade = yes(ativs.join(', '));
  else if(g.circunstancia && g.circunstancia!=='Saiu de casa'){
    q.atividade = yes(g.circunstancia==='Outra' ? (g.circOutra||'Outra') : g.circunstancia);
  }

  /* tempo, local e pontos */
  put('condicaoTempo', join([
    has(g.ceu)?('Céu: '+g.ceu):'',
    g.chuva==='sim'?'Chuva: sim':g.chuva==='nao'?'Chuva: não':'',
    has(g.temperatura)?(g.temperatura+' ºC'):''
  ]));
  put('municipioLocal', join([g.refArea, g.municipio], ' — '));
  put('upvLocal', join([g.upvTexto, has(g.upvCoord)?('('+g.upvCoord.trim()+')'):''], ' '));
  put('upvData', g.vistoData); put('upvHora', g.vistoHora);
  put('upcLocal', join([g.upcTexto, has(g.upcCoord)?('('+g.upcCoord.trim()+')'):''], ' '));
  put('ppi', g.ppiTexto);
  put('quemViuUltimo', g.testemunhaUpv);
  put('destinoRota', g.destino);
  put('destinoPrevisto', g.destino);

  /* comunicante */
  put('solNome', g.comNome);
  put('relacaoVitima', g.comRelacao);
  put('solTelRetorno', g.comTel);

  /* vestuário */
  put('camisa', g.vestSup);
  put('calca', g.vestInf);
  put('calcado', g.calcado);
  const roupas = [];
  if(has(g.vestSup)) roupas.push('Parte superior: '+g.vestSup.trim());
  if(has(g.vestInf)) roupas.push('Parte inferior: '+g.vestInf.trim());
  if(has(g.calcado)) roupas.push('Calçado: '+g.calcado.trim());
  if(eq.length) roupas.push('Equipamento levado: '+eq.join(', '));
  put('roupasItens', roupas.join('\n'));
  if(eq.includes('Mochila')) q.usavaMochila = yes('');
  else if(eq.includes('Nada')) q.usavaMochila = {val:'nao', detail:''};

  /* equipamento (GH) */
  if(eq.length){
    const nothing = eq.includes('Nada');
    const set = (k, label)=>{ if(eq.includes(label)) q[k]='sim'; else if(nothing) q[k]='nao'; };
    set('portaComida','Alimento'); set('portaAgua','Água'); set('portaIluminacao','Lanterna');
    set('portaRoupaFrio','Agasalho'); set('portaGPS','GPS');
  }
  if(has(g.celular) || has(g.operadora)) put('pCelular', join([g.celular, g.operadora], ' / '));

  /* saúde */
  if(has(g.condMedicas)) q.doencaLesao = yes(g.condMedicas.trim());
  if(has(g.medicacao)) q.usaMedicacao = yes(g.medicacao.trim());
  if(has(g.limitMobilidade)) q.limitacoes = yes(g.limitMobilidade.trim());

  /* experiência */
  if(g.conheceArea==='Muito') q.conheceArea='sim'; else if(g.conheceArea==='Nada') q.conheceArea='nao';
  if(g.expAtividade==='Muita') q.expAtividade='sim'; else if(g.expAtividade==='Nenhuma') q.expAtividade='nao';

  /* transtornos cognitivos / saúde mental */
  if(mental.includes(MENTAL_OPTS[0]) || fatores.includes('Demência')) q.demencia='sim';
  if(mental.includes(MENTAL_OPTS[1]) || fatores.includes('TEA')) q.autismo='sim';
  if(mental.includes(MENTAL_OPTS[2])) q.incapIntelectual='sim';
  if(mental.includes(MENTAL_OPTS[3])) q.enfermidadeMental = yes('');
  else if(fatores.includes('Acompanhamento em saúde mental')) q.enfermidadeMental = yes('Acompanhamento em saúde mental');
  if(mental.includes(MENTAL_OPTS[4])) q.depressivo='sim';
  if(mental.includes(MENTAL_OPTS[5]) || fatores.includes('Uso de álcool ou substâncias')) q.alcool='sim';
  if(g.jaSePerdeu==='sim') q.eventosAnteriores = yes('Já se perdeu antes');
  if(fatores.includes('Conflito ou discussão recente')) q.acontRecente = yes('Conflito ou discussão recente');

  /* recursos e encaminhamento */
  put('pontoEncontro', join([
    has(g.pcLocal)?('Posto de Comando: '+g.pcLocal.trim()):'',
    has(g.areaEspera)?('Área de espera: '+g.areaEspera.trim()):''
  ], '\n'));
  put('recursosAcionados', join([gArr(g.solicito).join(', '), g.solicitoObs], '\n'));
  if(docs.includes('Foto recente disponível')) q.fotoRecente='sim';

  /* comentários */
  put('comentarios', join([
    has(g.locais)?('Locais que costuma frequentar: '+g.locais.trim()):'',
    has(g.atrativos)?('Atrativos e pontos de interesse: '+g.atrativos.trim()):'',
    fatores.includes('Bilhete ou mensagem deixada')?'Bilhete ou mensagem deixada pela pessoa.':'',
    has(g.bo)?('Boletim de ocorrência nº '+g.bo.trim()):'',
    has(g.nOcorrencia)?('Guia de Comando — ocorrência nº '+g.nOcorrencia.trim()):''
  ], '\n'));

  return q;
}


/* =========================================================
   ROTAS (hash) — #/ · #/guia · #/gform/<id> · #/form/<id> · #/planejador · #/pop
   Tudo continua sendo UM arquivo HTML; as "páginas" são só telas.
   ========================================================= */
const VIEWS = ['home','guia','gform','form','planejador','pop'];
const state = { view:'home', id:null, sectionIdx:0, hubTab:'guias' };

function parseHash(){
  const h = (location.hash||'').replace(/^#\/?/,'');
  const parts = h.split('/');
  const v = parts[0] || 'home';
  let id = null;
  if(parts[1]){ try{ id = decodeURIComponent(parts[1]); }catch(e){ id = parts[1]; } }
  return { view: VIEWS.includes(v) ? v : 'home', id };
}
function hashFor(view, id){
  return view==='home' ? '#/' : '#/'+view+(id ? '/'+encodeURIComponent(id) : '');
}
function navigate(view, id){
  const target = hashFor(view, id);
  const cur = location.hash;
  const atHome = (cur===''||cur==='#'||cur==='#/');
  if(cur===target || (view==='home' && atHome)){ applyRoute(); }
  else { location.hash = target; }
}
function applyRoute(){
  const r = parseHash();
  if(r.view!==state.view || r.id!==state.id) state.sectionIdx = 0;
  state.view = r.view; state.id = r.id;
  render();
  window.scrollTo(0,0);
}

function render(){
  const app = document.getElementById('app');
  const heroSlot = document.getElementById('hero-slot');
  app.innerHTML = '';
  CUR_STORE = (state.view==='gform') ? GStore : QStore;
  document.body.dataset.view = state.view;
  if(state.view==='home'){
    heroSlot.innerHTML = heroMarkup();
    renderHome(app);
  } else {
    heroSlot.innerHTML = '';
    if(state.view==='guia') renderHub(app);
    else if(state.view==='gform') renderGuiaForm(app);
    else if(state.view==='form') renderForm(app);
    else if(state.view==='planejador') renderPlanning(app);
    else if(state.view==='pop') renderPop(app);
  }
}

/* ---------------- helpers de tela ---------------- */
function pageBar(app, backLabel, backView, title, sub){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="page-bar"><button class="btn ghost sm" id="pb-back">${escapeHtml(backLabel)}</button></div>
    <div class="page-head"><div class="ph-t">${escapeHtml(title)}</div>${sub?`<div class="ph-s">${escapeHtml(sub)}</div>`:''}</div>`;
  app.appendChild(wrap);
  wrap.querySelector('#pb-back').onclick = ()=>navigate(backView);
  return wrap;
}
function downloadBlob(blobOrBytes, filename, type){
  const blob = (blobOrBytes instanceof Blob) ? blobOrBytes : new Blob([blobOrBytes], {type:type||'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
async function downloadStaticPdf(path, filename, label){
  try{
    toast('Baixando "'+label+'"…');
    const resp = await fetch(path, {cache:'no-cache'});
    const ctype = (resp.headers.get('content-type')||'').toLowerCase();
    if(resp.status===404 || (resp.ok && ctype.indexOf('html')>=0)){
      toast('Arquivo "'+path+'" não encontrado no servidor. Confira se ele foi enviado ao GitHub, na mesma pasta do index.html, com exatamente esse nome.', true);
      return;
    }
    if(!resp.ok) throw new Error('HTTP '+resp.status);
    downloadBlob(await resp.blob(), filename, 'application/pdf');
    toast('"'+label+'" baixado.');
  }catch(err){
    console.error(err);
    toast('Não foi possível baixar (erro de rede). Verifique sua conexão.', true);
  }
}
function docCardHtml(p){

}

  container.appendChild(footer);
  app.appendChild(container);

  footer.querySelector('#btn-prev').onclick = ()=>{ if(!atFirst){ state.sectionIdx--; render(); window.scrollTo(0,0); } };
  footer.querySelector('#btn-next').onclick = ()=>{ if(!atLast){ state.sectionIdx++; render(); window.scrollTo(0,0); } };
  footer.querySelector('#btn-del').onclick = async ()=>{
    const ok = await confirmModal(opts.delTitle, opts.delBody);
    if(ok){ CUR_STORE.remove(ficha.id); toast(opts.delDone); if(opts.hubTab) state.hubTab = opts.hubTab; navigate('guia'); }

  footer.querySelector('#btn-pdf').onclick = ()=>{

      toast(opts.pdfDone);
    }catch(err){
      console.error(err);
      toast('Erro ao gerar PDF: '+err.message, true);
    }
  };
  return footer;
}

/* ---------------- PLANEJADOR DE BUSCA ---------------- */
function extractLatLngFromMapsUrl(text){
  text = String(text||'').trim();
  const patterns = [
    /!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,
    /@(-?\d{1,2}\.\d+),(-?\d{1,3}\.\d+)/,
    /[?&](?:q|query|ll|center|destination|daddr|saddr)=(?:loc:)?(-?\d{1,2}\.\d+)(?:,|%2C)\s*\+?(-?\d{1,3}\.\d+)/i,
    /\/(?:place|search|dir)\/(?:[^/@]*\/)?(-?\d{1,2}\.\d+),\+?(-?\d{1,3}\.\d+)/,
    /^(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)$/,
  ];
  for(const re of patterns){
    const m = text.match(re);
    if(m){
      const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
      if(isFinite(lat) && isFinite(lng) && Math.abs(lat)<=90 && Math.abs(lng)<=180) return { lat, lng };
    }
  }
  return null;
}
/* aceita: -20.8977 · -20,8977 · 20.8977 S · 20°53'51.8"S · sinal "−" (unicode) */
function parseCoordValue(s){
  if(s==null) return NaN;
  let t = String(s).trim().replace(/[−–—]/g,'-').replace(/ /g,' ');
  if(!t) return NaN;
  const hemi = (c)=> /^[SWO]$/i.test(c) ? -1 : 1;
  let m = t.match(/^(-?)\s*(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′’]\s*(\d{1,2}(?:[.,]\d+)?)\s*(?:["″”]|'')?\s*([NSEWOL])?$/i);
  if(m){
    const v = parseInt(m[2],10) + parseInt(m[3],10)/60 + parseFloat(m[4].replace(',','.'))/3600;
    const sign = m[5] ? hemi(m[5]) : (m[1]==='-' ? -1 : 1);
    return sign*v;
  }
  m = t.match(/^(-?)\s*(\d{1,3}(?:[.,]\d+)?)\s*°?\s*([NSEWOL])?$/i);
  if(m){
    const v = parseFloat(m[2].replace(',','.'));
    const sign = m[3] ? hemi(m[3]) : (m[1]==='-' ? -1 : 1);
    return sign*v;
  }
  return NaN;
}
function splitCoordPair(s){
  const m = String(s||'').trim().replace(/[−–—]/g,'-').match(/^(-?\d{1,3}[.,]\d+)\s*[,;\s]\s*(-?\d{1,3}[.,]\d+)$/);
  return m ? [m[1].replace(',','.'), m[2].replace(',','.')] : null;
}
function isShortMapsLink(u){ return /^https?:\/\/(?:maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)\b/i.test(u); }
async function resolveMapsInput(text){
  text = String(text||'').trim();
  const direct = extractLatLngFromMapsUrl(text);
  if(direct) return direct;
  const um = text.match(/https?:\/\/[^\s]+/);
  if(!um) return null;
  const url = um[0];
  const again = extractLatLngFromMapsUrl(url);
  if(again) return again;
  if(!isShortMapsLink(url)) return null;
  const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
  const timer = ctl ? setTimeout(()=>ctl.abort(), 15000) : null;
  try{
    const resp = await fetch('/api/resolve?url='+encodeURIComponent(url), ctl?{signal:ctl.signal}:undefined);
    if(!resp.ok) return null;
    const j = await resp.json();
    if(j && isFinite(j.lat) && isFinite(j.lng)) return {lat:j.lat, lng:j.lng};
    if(j && j.finalUrl) return extractLatLngFromMapsUrl(j.finalUrl);
    return null;
  }catch(e){ return null; }
  finally{ if(timer) clearTimeout(timer); }
}

function circlePolygonCoords(lat, lng, radiusM, points){
  points = points || 72;
  const coords = [];
  const latRad = lat * Math.PI/180;
  for(let i=0;i<=points;i++){
    const theta = (i/points)*2*Math.PI;
    const dLat = (radiusM/111320) * Math.cos(theta);
    const dLng = (radiusM/(111320*Math.cos(latRad))) * Math.sin(theta);
    coords.push((lng+dLng).toFixed(6)+','+(lat+dLat).toFixed(6)+',0');
  }
  return coords.join(' ');
}

function buildSearchKml(lat, lng, rings, profileLabel, terrainLabel){
  const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const meta = terrainLabel ? `${esc(profileLabel)} · ${esc(terrainLabel)}` : esc(profileLabel);

  let placemarks = `
    <Placemark>
      <name>PPI — Ponto de Planejamento Inicial</name>
      <description>Perfil: ${meta}</description>
      <Style><IconStyle><color>ff0000ff</color><scale>1.3</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/target.png</href></Icon></IconStyle></Style>
      <Point><coordinates>${lng.toFixed(6)},${lat.toFixed(6)},0</coordinates></Point>
    </Placemark>`;

  rings.forEach(ring=>{
    const radiusM = ring.km*1000;
    placemarks += `
    <Placemark>
      <name>Raio ${ring.pct} — ${ring.km.toFixed(2)} km</name>
      <description>Probabilidade de ${ring.pct} de encontrar a vítima dentro deste raio (${meta})</description>
      <Style>
        <LineStyle><color>${ring.line}</color><width>3.5</width></LineStyle>
        <PolyStyle><fill>0</fill><outline>1</outline></PolyStyle>
      </Style>
      <Polygon>
        <tessellate>1</tessellate>
        <outerBoundaryIs><LinearRing><coordinates>${circlePolygonCoords(lat,lng,radiusM)}</coordinates></LinearRing></outerBoundaryIs>
      </Polygon>
    </Placemark>`;
  });

  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>Plano de Busca — ${esc(profileLabel)}</name>
  <description>Gerado por Busca de Pessoas Perdidas em Áreas Remotas (CBMES). PPI: ${lat.toFixed(6)}, ${lng.toFixed(6)} · Perfil: ${meta}</description>
  ${placemarks}
</Document>
</kml>`;
}

const RING_DEFS = [
  {key:'p25', pct:'25%', line:'ff0000ff', dot:'#ff5a5a'},
  {key:'p50', pct:'50%', line:'ff00ffff', dot:'#e8d24a'},
  {key:'p75', pct:'75%', line:'ffffff00', dot:'#4ad8d8'},
  {key:'p95', pct:'95%', line:'ffffffff', dot:'#cfcfcf'},
];

function renderPlanning(app){
  pageBar(app, '← Início', 'home', 'Planejador de Busca',
    'Informe o PPI (ponto de planejamento inicial), o perfil da vítima e o tipo de terreno. Gera um KML com os círculos de 25/50/75/95% de probabilidade, pronto para abrir no Google Earth.');
  const wrap = document.createElement('div');

  const card = document.createElement('div');
  card.className = 'section-card';
  card.innerHTML = `
    <div class="field">
      <label>Como quer informar a coordenada?</label>
      <div class="bool-group">
        <div class="bool-btn sim active" id="mode-decimal" style="flex:1">Graus decimais</div>
        <div class="bool-btn sim" id="mode-link" style="flex:1">Link do Google Maps</div>
      </div>
    </div>
    <div id="coord-decimal-wrap">
      <div class="field-row">
        <div class="field"><label>Latitude</label>
          <div class="coord-in"><input type="text" id="in-lat" placeholder="-20.8977" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="sign-btn" data-for="in-lat" aria-label="Alternar sinal negativo">±</button></div></div>
        <div class="field"><label>Longitude</label>
          <div class="coord-in"><input type="text" id="in-lng" placeholder="-41.1264" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" class="sign-btn" data-for="in-lng" aria-label="Alternar sinal negativo">±</button></div></div>
      </div>
      <div class="photo-hint" style="margin:-6px 0 12px;">No Espírito Santo as duas são negativas (sul e oeste): toque em <b>±</b> para colocar o sinal de menos. Também pode colar "lat, long" de uma vez no campo de latitude.</div>
    </div>
    <div id="coord-link-wrap" class="field hidden">
      <label>Link do Google Maps</label>
      <input type="text" id="in-link" placeholder="Cole aqui o link (https://maps.app.goo.gl/… ou https://www.google.com/maps/…)" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="photo-hint" style="margin-top:5px;">Aceita link curto (maps.app.goo.gl) e link completo. Se o link curto não for reconhecido, abra-o no navegador e cole o endereço completo.</div>
    </div>
    <div class="field">
      <label>Perfil da vítima</label>
      <select id="in-profile">${VICTIM_PROFILES.map(p=>`<option value="${p.key}">${escapeHtml(p.label)}${p.critical?' — crítico':''}</option>`).join('')}<option value="OUTROS">Outros (perfil não listado)</option></select>
    </div>
    <div class="field" id="terrain-field">
      <label>Tipo de terreno</label>
      <div class="bool-group">
        <div class="bool-btn sim active" id="terrain-montanhosa" style="flex:1">Montanhosa</div>
        <div class="bool-btn sim" id="terrain-plana" style="flex:1">Não montanhosa</div>
      </div>
    </div>
    <div class="field">
      <label id="ring-label">Raios a incluir no plano</label>
      <div id="ring-hint" class="photo-hint hidden" style="margin-bottom:8px;">Perfil "Outros" não tem raio pré-definido — digite a distância (em km) de cada anel que quiser usar.</div>
      <div class="checklist ring-list" id="ring-checklist">
        ${RING_DEFS.map(rd=>`
        <label class="check-item ring-item">
          <span class="cl"><span style="color:${rd.dot};font-weight:800;">●</span> Raio ${rd.pct}</span>
          <input type="text" id="val-${rd.key.slice(1)}" inputmode="decimal" class="ring-val" readonly>
          <span class="unit">km</span>
          <input type="checkbox" id="chk-${rd.key.slice(1)}" checked class="ring-chk">
        </label>`).join('')}
      </div>
    </div>
    <button class="btn primary block" id="btn-gen-kml">Gerar plano de busca (KML)</button>
  `;
  wrap.appendChild(card);

  /* Perfis das vítimas (PDF) dentro do planejador */
  wrap.appendChild(profilesBlock());
  app.appendChild(wrap);

  let mode = 'decimal', terrain = 'montanhosa';
  const modeDecimal = card.querySelector('#mode-decimal');
  const modeLink = card.querySelector('#mode-link');
  const decWrap = card.querySelector('#coord-decimal-wrap');
  const linkWrap = card.querySelector('#coord-link-wrap');
  modeDecimal.onclick = ()=>{ mode='decimal'; modeDecimal.classList.add('active'); modeLink.classList.remove('active'); decWrap.classList.remove('hidden'); linkWrap.classList.add('hidden'); };
  modeLink.onclick = ()=>{ mode='link'; modeLink.classList.add('active'); modeDecimal.classList.remove('active'); linkWrap.classList.remove('hidden'); decWrap.classList.add('hidden'); };

  const inLat = card.querySelector('#in-lat'), inLng = card.querySelector('#in-lng');
  card.querySelectorAll('.sign-btn').forEach(b=>{
    b.onclick = ()=>{
      const inp = card.querySelector('#'+b.dataset.for);
      let v = inp.value.trim().replace(/[−–—]/g,'-');
      inp.value = v.startsWith('-') ? v.slice(1) : '-'+v;
      inp.focus();
    };
  });
  inLat.addEventListener('input', ()=>{
    const pair = splitCoordPair(inLat.value);
    if(pair){ inLat.value = pair[0]; inLng.value = pair[1]; toast('Latitude e longitude preenchidas.'); }
  });

  const tMontanhosa = card.querySelector('#terrain-montanhosa');
  const tPlana = card.querySelector('#terrain-plana');
  tMontanhosa.onclick = ()=>{ terrain='montanhosa'; tMontanhosa.classList.add('active'); tPlana.classList.remove('active'); fillSuggested(); };
  tPlana.onclick = ()=>{ terrain='plana'; tPlana.classList.add('active'); tMontanhosa.classList.remove('active'); fillSuggested(); };

  const profileSelect = card.querySelector('#in-profile');
  profileSelect.onchange = fillSuggested;
  const terrainField = card.querySelector('#terrain-field');
  const ringHint = card.querySelector('#ring-hint');
  function fillSuggested(){
    const isOutros = profileSelect.value === 'OUTROS';
    terrainField.classList.toggle('hidden', isOutros);
    ringHint.classList.toggle('hidden', !isOutros);
    RING_DEFS.forEach(rd=>{
      const inp = card.querySelector('#val-'+rd.key.slice(1));
      if(isOutros){
        inp.value = ''; inp.placeholder = 'km'; inp.removeAttribute('readonly'); inp.classList.add('editable');
      } else {
        inp.value = SEARCH_RADIUS_KM[profileSelect.value][terrain][rd.key];
        inp.setAttribute('readonly','readonly'); inp.classList.remove('editable');
      }
    });
  }
  fillSuggested();

  const btnGen = card.querySelector('#btn-gen-kml');
  btnGen.onclick = async ()=>{
    let lat, lng;
    if(mode==='decimal'){
      lat = parseCoordValue(inLat.value);
      lng = parseCoordValue(inLng.value);
    } else {
      const raw = card.querySelector('#in-link').value;
      if(!raw.trim()){ toast('Cole o link do Google Maps.', true); return; }
      btnGen.disabled = true; const old = btnGen.textContent; btnGen.textContent = 'Lendo o link…';
      let parsed = null;
      try{ parsed = await resolveMapsInput(raw); } finally { btnGen.disabled = false; btnGen.textContent = old; }
      if(!parsed){
        toast('Não consegui encontrar a coordenada nesse link. Abra-o no navegador e cole o endereço completo da barra, ou segure o pino no Maps, copie as coordenadas e use "Graus decimais".', true);
        return;
      }
      lat = parsed.lat; lng = parsed.lng;
    }
    if(isNaN(lat) || isNaN(lng) || lat<-90 || lat>90 || lng<-180 || lng>180){
      toast('Coordenada inválida. Confira os valores (use ± para o sinal negativo).', true); return;
    }
    const profileKey = profileSelect.value;
    const checkedDefs = RING_DEFS.filter(rd => card.querySelector('#chk-'+rd.key.slice(1)).checked);
    if(!checkedDefs.length){ toast('Selecione ao menos um raio para incluir no plano.', true); return; }
    const selectedRings = [];
    for(const rd of checkedDefs){
      const km = parseFloat(card.querySelector('#val-'+rd.key.slice(1)).value.replace(',','.'));
      if(isNaN(km) || km<=0){ toast('Confira o raio de '+rd.pct+' — precisa ser um número maior que zero.', true); return; }
      selectedRings.push({pct:rd.pct, km, line:rd.line});
    }
    const isOutros = profileKey === 'OUTROS';
    const profileLabel = isOutros ? 'Outros' : VICTIM_PROFILES.find(p=>p.key===profileKey).label;
    const terrainLabel = isOutros ? '' : (terrain==='montanhosa' ? 'Área montanhosa' : 'Área não montanhosa');
    try{
      const kml = buildSearchKml(lat, lng, selectedRings, profileLabel, terrainLabel);
      downloadBlob(new Blob([kml], {type:'application/vnd.google-earth.kml+xml'}), 'Plano_Busca_'+profileLabel.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w]+/g,'_')+'.kml');
      toast('KML gerado. Abra no Google Earth para visualizar os círculos.');
    }catch(err){
      console.error(err);
      toast('Não foi possível gerar o plano.', true);
    }
  };
}
