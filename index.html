<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#100E0E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Busca PP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Busca de Pessoas Perdidas em Áreas Remotas | CBMES</title>
<style>
  :root{
    --void:#100E0E; --bg:#150F0F; --panel:#1C1717; --panel-2:#241D1D; --panel-3:#2D2424;
    --border:#3A3030; --border-2:#4A3D3D;
    --text:#F6F2F0; --text-dim:#B3A9A7; --text-faint:#7C7170;
    --red:#EC323E; --red-dim:#B8232C; --red-glow:rgba(236,50,62,.28);
    --gold:#FFCC29; --gold-dim:#C9A11E;
    --steel:#9A9C9E; --steel-dim:#6E7072;
    --accent:#EC323E; --accent-dim:#B8232C; --accent-glow:rgba(236,50,62,.22);
    --ok:#3FA34D; --ok-dim:#2B7038; --warn:#D8483A; --warn-dim:#A8362B;
    --radius:10px;
    --mono:ui-monospace,SFMono-Regular,Consolas,'Courier New',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{min-height:100vh;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--accent);color:#1a1a1a;}
  input,textarea,select,button{font-family:inherit;color:inherit;}
  a{color:var(--accent);}
  .hidden{display:none !important;}

  /* ---------- Hero (tela principal) ---------- */
  #hero{
    position:relative; overflow:hidden;
    padding:44px 20px 40px;
    background:
      radial-gradient(ellipse 640px 420px at 50% -10%, var(--red-glow), transparent 65%),
      linear-gradient(180deg, var(--void), #171212 70%, var(--bg));
    border-bottom:1px solid var(--border);
    text-align:center;
  }
  #hero::before{
    content:''; position:absolute; inset:0; pointer-events:none; opacity:.05;
    background-image:repeating-linear-gradient(115deg, #fff 0 1px, transparent 1px 64px);
  }
  #hero .crest{ width:112px; height:112px; margin:0 auto 18px; filter:drop-shadow(0 8px 24px rgba(236,50,62,.35)); position:relative; }
  #hero .crest img{ width:100%; height:100%; display:block; }
  #hero .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--gold);
    text-transform:uppercase; font-weight:700; margin-bottom:10px;
  }
  #hero h1{
    margin:0; font-size:30px; line-height:1.12; font-weight:800; letter-spacing:-.4px;
    color:#fff; text-transform:uppercase;
  }
  #hero h1 span{ color:var(--red); }
  #hero .ribbon{
    width:150px; height:4px; margin:18px auto 16px; border-radius:2px; position:relative;
    background:linear-gradient(90deg, var(--red) 0 33%, var(--gold) 33% 66%, var(--steel) 66% 100%);
  }
  #hero .sub{
    max-width:480px; margin:0 auto; color:var(--text-dim); font-size:13.5px; line-height:1.55;
  }
  #hero .sub b{ color:var(--text); }

  main{max-width:900px;margin:0 auto;padding:20px 16px 90px;}
  main.no-top-pad{padding-top:26px;}

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none;border:1px solid var(--border-2);background:var(--panel-2);color:var(--text);
    padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:.12s ease;white-space:nowrap;
  }
  .btn:hover{background:var(--panel-3);border-color:var(--text-faint);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#1a1500;}
  .btn.primary:hover{background:#ff4d57;}
  .btn.ghost{background:transparent;}
  .btn.danger{color:#ffb3ab;border-color:var(--warn-dim);}
  .btn.danger:hover{background:rgba(216,72,58,.12);}
  .btn.block{width:100%;justify-content:center;}
  .btn.sm{padding:7px 11px;font-size:12.5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- List view ---------- */
  .actions-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px;}
  .action-card{
    position:relative; overflow:hidden;
    border:1px solid var(--border-2); border-radius:12px; padding:18px 16px;
    background:var(--panel); cursor:pointer; text-align:left; transition:.15s ease;
  }
  .action-card:hover{border-color:var(--red); background:var(--panel-2); transform:translateY(-1px);}
  .action-card.primary{ background:linear-gradient(155deg, var(--red-dim), #7d1319 130%); border-color:var(--red); }
  .action-card.primary:hover{ filter:brightness(1.08); }
  .action-card .ic{
    width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#fff;font-family:var(--mono);background:rgba(255,255,255,.12);margin-bottom:10px;
  }
  .action-card:not(.primary) .ic{ color:var(--red); background:rgba(236,50,62,.12); }
  .action-card .lb{font-weight:800;font-size:13.5px;letter-spacing:.1px;}
  .action-card .sb{font-size:11.5px;color:var(--text-dim);margin-top:3px;}
  .action-card.primary .sb{color:rgba(255,255,255,.75);}
  input[type=file]{display:none;}

  .profiles-entry{
    display:flex; align-items:center; gap:12px; width:100%;
    border:1px solid var(--border-2); border-radius:12px; padding:14px 16px; margin-bottom:6px;
    background:var(--panel); cursor:pointer; text-align:left; transition:.15s ease;
  }
  .profiles-entry:hover{border-color:var(--gold); background:var(--panel-2);}
  .profiles-entry .ic{
    width:32px;height:32px;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;
    background:rgba(255,204,41,.12); color:var(--gold); font-size:15px;
  }
  .profiles-entry .main{flex:1;min-width:0;}
  .profiles-entry .lb{font-weight:800;font-size:13.5px;}
  .profiles-entry .sb{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
  .profiles-entry .chev{color:var(--text-faint);font-size:18px;}

  .profile-card{
    display:flex;align-items:center;gap:14px;
    border:1px solid var(--border); background:var(--panel);border-radius:12px;
    padding:15px 16px;margin-bottom:10px;cursor:pointer;transition:.15s ease;position:relative;overflow:hidden;
  }
  .profile-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--red);}
  .profile-card:hover{border-color:var(--border-2); background:var(--panel-2); transform:translateY(-1px);}
  .profile-card .tag{
    font-family:var(--mono); font-weight:800; font-size:11px; letter-spacing:.5px; color:var(--red);
    text-transform:uppercase;
  }
  .profile-card .lb{font-weight:800;font-size:15.5px;margin-top:2px;}
  .profile-card .sb{font-size:12px;color:var(--text-dim);margin-top:3px;}
  .profile-card .dl{
    flex:none; width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    background:rgba(236,50,62,.1); color:var(--red); font-size:15px;
  }

  .list-heading{font-size:11px;font-family:var(--mono);color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;margin:22px 2px 10px;display:flex;align-items:center;gap:8px;}
  .list-heading::after{content:'';flex:1;height:1px;background:var(--border);}
  .ficha-card{
    display:flex;align-items:center;gap:12px;position:relative;
    border:1px solid var(--border); background:var(--panel);border-radius:12px;
    padding:13px 14px 13px 17px;margin-bottom:9px;cursor:pointer;transition:.15s ease;
  }
  .ficha-card::before{
    content:''; position:absolute; left:0; top:10px; bottom:10px; width:3px; border-radius:3px;
    background:var(--border-2); transition:.15s ease;
  }
  .ficha-card:hover{border-color:var(--border-2); background:var(--panel-2); transform:translateY(-1px);}
  .ficha-card:hover::before{background:var(--red);}
  .ficha-card .letter{
    width:38px;height:38px;border-radius:8px;flex:none;background:var(--panel-3);
    display:flex;align-items:center;justify-content:center;font-family:var(--mono);
    font-weight:700;font-size:15px;color:var(--text-dim);border:1px solid var(--border-2);
  }
  .ficha-card .main{flex:1;min-width:0;}
  .ficha-card .name{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ficha-card .name.empty{color:var(--text-faint);font-weight:500;font-style:italic;}
  .ficha-card .date{font-size:11px;color:var(--text-faint);font-family:var(--mono);margin-top:2px;}
  .pill{font-size:10px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.4px;padding:3px 8px;border-radius:20px;border:1px solid var(--border-2);color:var(--text-dim);white-space:nowrap;}
  .pill.imported{color:#ffd39c;border-color:#7a5322;background:rgba(255,170,60,.08);}
  .empty-state{text-align:center;padding:50px 16px;color:var(--text-faint);}
  .empty-state .big{font-size:34px;margin-bottom:6px;}

  /* ---------- Form view ---------- */
  #formbar{
    position:sticky;top:0;z-index:15;background:var(--panel);border-bottom:1px solid var(--border);
    padding:10px 14px;display:flex;align-items:center;gap:8px;
  }
  #formbar .fname{flex:1;min-width:0;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #formbar .savedtag{font-size:10.5px;color:var(--ok);font-family:var(--mono);white-space:nowrap;}

  .nav-rail{
    display:flex; gap:6px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:thin;
  }
  .nav-rail::-webkit-scrollbar{height:5px;}
  .nav-rail::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px;}
  .nav-chip{
    flex:none; width:36px;height:36px;border-radius:8px;border:1px solid var(--border-2);
    background:var(--panel); color:var(--text-dim); font-family:var(--mono); font-weight:700;font-size:13px;
    display:flex;align-items:center;justify-content:center;cursor:pointer; position:relative;
  }
  .nav-chip.active{background:var(--accent);border-color:var(--accent);color:#1a1500;}
  .nav-chip.filled:not(.active)::after{
    content:'';position:absolute;bottom:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--ok);
  }

  .section-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 16px;margin:14px 0;}
  .section-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .section-head .let{font-family:var(--mono);color:var(--accent);font-weight:800;font-size:16px;}
  .section-head .ttl{font-weight:700;font-size:15px;}
  .section-head .sub{font-size:11.5px;color:var(--text-faint);margin-top:2px;}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .field input[type=text], .field input[type=date], .field input[type=time], .field textarea, .field select{
    width:100%;background:var(--panel-2);border:1px solid var(--border-2);border-radius:7px;
    padding:9px 11px;font-size:16px;color:var(--text);
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
  .field textarea{resize:vertical;min-height:64px;line-height:1.4;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  @media (max-width:520px){.field-row{grid-template-columns:1fr;}}

  .bool-group{display:flex;gap:8px;}
  .bool-btn{
    flex:1; padding:9px 10px; border-radius:7px; border:1px solid var(--border-2); background:var(--panel-2);
    text-align:center; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-dim);
  }
  .bool-btn.sim.active{background:rgba(63,163,77,.15);border-color:var(--ok);color:#8fe39c;}
  .bool-btn.nao.active{background:rgba(216,72,58,.12);border-color:var(--warn);color:#f0958c;}
  .bool-detail{margin-top:8px;}

  .checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
  @media (max-width:520px){.checklist{grid-template-columns:1fr;}}
  .check-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--border);border-radius:7px;}
  .check-item .cl{font-size:13px;}
  .check-item .bool-group{max-width:120px;}
  .check-item .bool-btn{padding:5px 6px;font-size:11.5px;}

  .formfooter{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
  .formfooter .nav-row{display:flex;gap:10px;}
  .formfooter .nav-row .btn{flex:1;justify-content:center;}

  .photo-field{display:flex;align-items:flex-start;gap:14px;margin-bottom:6px;flex-wrap:wrap;}
  .photo-perfil{flex:1;min-width:180px;}
  .photo-perfil label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
  .photo-perfil input{width:100%;background:var(--panel-2);border:1px solid var(--border-2);border-radius:7px;padding:9px 11px;font-size:16px;color:var(--text);}
  .photo-perfil input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
  .photo-perfil .hint{font-size:11px;color:var(--text-faint);margin-top:5px;}
  .photo-thumb{
    width:84px;height:100px;border-radius:8px;object-fit:cover;flex:none;
    border:1px solid var(--border-2);background:var(--panel-2);
  }
  .photo-placeholder{
    width:84px;height:100px;border-radius:8px;flex:none;border:1px dashed var(--border-2);
    display:flex;align-items:center;justify-content:center;color:var(--text-faint);
    font-size:10px;text-align:center;font-family:var(--mono);background:var(--panel-2);
  }
  .photo-actions{display:flex;flex-direction:column;gap:6px;}
  .photo-hint{font-size:11px;color:var(--text-faint);margin-top:2px;}

  .ficha-card .letter img{width:100%;height:100%;object-fit:cover;border-radius:8px;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:22px;transform:translate(-50%,12px);
    background:var(--panel-3);border:1px solid var(--border-2);color:var(--text);
    padding:11px 18px;border-radius:24px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transition:.22s ease;z-index:50;font-weight:600;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}
  #toast.err{border-color:var(--warn-dim);color:#ffb3ab;}

  /* ---------- Modal (confirm) ---------- */
  #modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;}
  #modal{background:var(--panel);border:1px solid var(--border-2);border-radius:var(--radius);padding:20px;max-width:360px;width:100%;}
  #modal .mtitle{font-weight:700;font-size:15px;margin-bottom:8px;}
  #modal .mbody{font-size:13.5px;color:var(--text-dim);margin-bottom:16px;line-height:1.5;}
  #modal .mrow{display:flex;gap:8px;justify-content:flex-end;}


  /* =====================================================
     v2 — título, home, central da Guia, formulário da Guia
     ===================================================== */
  #hero h1{ font-size:26px; }
  #hero h1 small{
    display:block; font-size:.5em; font-weight:700; letter-spacing:.34em; line-height:1.6;
    color:#e9dfdd; text-transform:uppercase; padding-left:.34em;
  }
  #hero h1 span{
    display:block; font-size:clamp(28px,8.8vw,46px); line-height:1.04; margin:2px 0 4px;
    text-shadow:0 2px 28px rgba(236,50,62,.38);
  }
  #hero .ribbon{ margin:18px auto 20px; }
  #hero .defn{
    max-width:520px; margin:0 auto; text-align:left; position:relative;
    background:rgba(255,255,255,.04); border:1px solid var(--border-2); border-left:3px solid var(--gold);
    border-radius:10px; padding:14px 16px 12px;
  }
  .defn-k{ font-family:var(--mono); font-size:10.5px; letter-spacing:1.6px; color:var(--gold); text-transform:uppercase; font-weight:700; margin-bottom:8px; }
  .defn p{ margin:0 0 8px; font-size:13.5px; line-height:1.55; color:var(--text-dim); }
  .defn p b{ color:var(--text); }
  .defn p.defn-2{ font-size:12.5px; margin-bottom:2px; color:var(--text-faint); }
  .defn p.defn-2 b{ color:var(--text-dim); }

  .home-grid{ display:grid; gap:12px; margin-top:6px; }
  .home-card{
    display:flex; align-items:center; gap:14px; text-decoration:none; color:var(--text);
    border:1px solid var(--border-2); border-radius:14px; padding:18px 16px; background:var(--panel);
    transition:.15s ease; position:relative; overflow:hidden;
  }
  .home-card:hover{ border-color:var(--red); background:var(--panel-2); transform:translateY(-1px); }
  .home-card.primary{ background:linear-gradient(155deg, var(--red-dim), #7d1319 130%); border-color:var(--red); }
  .home-card .hc-ic{
    flex:none; width:50px; height:50px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:rgba(236,50,62,.12); color:var(--red);
  }
  .home-card.primary .hc-ic{ background:rgba(255,255,255,.14); color:#fff; }
  .home-card .hc-main{ flex:1; min-width:0; }
  .home-card .hc-k{ font-family:var(--mono); font-size:10px; letter-spacing:1.3px; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .home-card.primary .hc-k{ color:#ffe28a; }
  .home-card .hc-t{ font-weight:800; font-size:18px; margin-top:3px; letter-spacing:-.1px; }
  .home-card .hc-s{ font-size:12.5px; color:var(--text-dim); margin-top:4px; line-height:1.45; }
  .home-card.primary .hc-s{ color:rgba(255,255,255,.8); }
  .home-card .hc-chev{ color:var(--text-faint); font-size:26px; flex:none; }
  .home-foot{ margin-top:22px; padding:12px 14px; border:1px dashed var(--border-2); border-radius:10px; font-size:12px; color:var(--text-faint); line-height:1.5; }
  .home-foot b{ color:var(--text-dim); }

  .page-bar{ margin:6px 0 14px; }
  .page-head{ margin-bottom:18px; }
  .page-head .ph-t{ font-weight:800; font-size:21px; letter-spacing:-.2px; }
  .page-head .ph-s{ font-size:12.5px; color:var(--text-dim); margin-top:5px; line-height:1.5; }

  .hub-actions{ margin-bottom:6px; }
  .hub-actions .action-card .sb{ line-height:1.35; }
  .hub-tabs{ display:flex; gap:6px; margin:18px 0 4px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:4px; }
  .hub-tabs button{ flex:1; padding:9px 6px; border:0; border-radius:7px; background:transparent; color:var(--text-dim); font-weight:700; font-size:13px; cursor:pointer; }
  .hub-tabs button.on{ background:var(--panel-3); color:var(--text); box-shadow:inset 0 0 0 1px var(--border-2); }
  .hub-cols{ display:block; }
  .hub-cols[data-tab="guias"] .hub-col[data-c="q"]{ display:none; }
  .hub-cols[data-tab="q"] .hub-col[data-c="guias"]{ display:none; }
  @media (min-width:760px){
    main{ max-width:960px; }
    .hub-tabs{ display:none; }
    .hub-cols{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
    .hub-cols .hub-col{ display:block !important; }
    .home-grid{ grid-template-columns:1fr; }
  }
  .ficha-card .letter.g{ background:rgba(236,50,62,.14); color:var(--red); border-color:rgba(236,50,62,.4); }
  .pill.crit{ color:#fff; background:var(--warn); border-color:var(--warn); font-weight:700; }

  .doc-card{
    display:flex; align-items:center; gap:12px; position:relative; overflow:hidden;
    border:1px solid var(--border); background:var(--panel); border-radius:12px; padding:14px 14px 14px 18px; margin-bottom:10px;
  }
  .doc-card::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red); }
  .doc-card .dc-main{ flex:1; min-width:0; }
  .doc-card .dc-tags{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .doc-card .dc-tag{ font-family:var(--mono); font-weight:800; font-size:10.5px; letter-spacing:.5px; color:var(--red); text-transform:uppercase; }
  .crit-badge{ display:inline-flex; align-items:center; gap:4px; font-family:var(--mono); font-weight:800; font-size:10px; letter-spacing:.4px; color:#fff; background:var(--warn); padding:2px 7px; border-radius:20px; }
  .doc-card .dc-t{ font-weight:800; font-size:15.5px; margin-top:3px; }
  .doc-card .dc-s{ font-size:12px; color:var(--text-dim); margin-top:3px; line-height:1.4; }

/* ---- lógica derivada (usada na tela e no PDF) ---- */
function gArr(v){ return Array.isArray(v) ? v : []; }
function guiaIsCritical(d){
  if(d.perfilCritico==='sim') return true;
  const m = gArr(d.mental).filter(x=>MENTAL_OPTS.indexOf(x) < MENTAL_CRITICAL_COUNT && MENTAL_OPTS.indexOf(x)>=0);
  return m.length>0 || gArr(d.criancas).length>0;
}
function guiaProfileKey(d){
  const m = gArr(d.mental), c = gArr(d.criancas), a = gArr(d.atividade);
  if(m.includes(MENTAL_OPTS[0])) return 'DEMENCIA';
  if(m.includes(MENTAL_OPTS[1])) return 'AUTISTA';
  if(m.includes(MENTAL_OPTS[4])) return 'ABATIDO';
  if(c.includes(CRIANCA_OPTS[2])) return 'CRIANCA_7_9';
  if(a.includes('Caçador')) return 'CACADOR';
  if(a.includes('Caminhante / trilheiro')) return 'CAMINHANTE';
  return null;
}
function urgencySummary(d){
  const u = d.urg || {};
  let sum = 0, n = 0, ones = 0;
  URG_FACTORS.forEach(f=>{ const v = parseInt(u[f.k],10); if(v>=1 && v<=4){ sum+=v; n++; if(v===1) ones++; } });
  let band = '';
  if(n===URG_FACTORS.length){
    band = sum<=14 ? 'Emergência' : sum<=22 ? 'Mensurada' : 'Avaliar e investigar';
  }
  return {sum, n, total:URG_FACTORS.length, ones, band};
}
function guiaVictimName(d){
  const n = (d.nomeCompleto||'').trim() || (d.nomeIdade||'').trim();
  return n;
}
function guiaCategoriaTexto(d){
  const parts = [];
  if((d.categoriaAdotada||'').trim()) parts.push(d.categoriaAdotada.trim());
  return parts.join(' / ');
}
function fmtDateBR(iso){
  if(!iso) return '';
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  return m ? m[3]+'/'+m[2]+'/'+m[1] : String(iso);
}
function guiaHasData(d, fic){
  return fic.fields.some(f=>{
    if(!f.k && !['matrix','raios','missions'].includes(f.t)) return false;
    if(f.t==='matrix') return Object.keys(d.urg||{}).length>0;
    if(f.t==='raios') return !!(d.r25||d.r50||d.r75||d.r95);
    if(f.t==='missions') return gArr(d.missoes).some(m=>m && Object.values(m).some(x=>x));
    const v = d[f.k];
    if(Array.isArray(v)) return v.length>0;
    return v!==undefined && v!==null && v!=='';
  });
}


/* =========================================================
   STORAGE — duas listas independentes neste aparelho:
   • Questionários (chave antiga, preservada p/ não perder dados)
   • Guias de Comando
   ========================================================= */
function makeStore(key, prefix){
  const store = {
    key,
    load(){
      try{
        const v = JSON.parse(localStorage.getItem(key) || '[]');
        return Array.isArray(v) ? v : [];
      }catch(e){ return []; }
    },
    save(list){
      try{ localStorage.setItem(key, JSON.stringify(list)); return true; }
      catch(e){
        toast('A memória deste aparelho está cheia. Gere o PDF desta ficha e exclua fichas antigas.', true);
        return false;
      }
    },
    get(id){ return store.load().find(x=>x.id===id) || null; },
    upsert(f){
      const list = store.load();
      const i = list.findIndex(x=>x.id===f.id);
      if(i>=0) list[i]=f; else list.push(f);
      return store.save(list);
    },
    remove(id){ store.save(store.load().filter(x=>x.id!==id)); },
    create(data, imported){
      const now = new Date().toISOString();
      return {
        id: prefix+Date.now()+'_'+Math.random().toString(36).slice(2,8),
        createdAt: now, updatedAt: now, imported: !!imported, data: data || {}
      };
    }
  };
  return store;
}

function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return '';
  const p = n=>String(n).padStart(2,'0');
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function buildFileName(ficha){
  const d = ficha.data;
  let dateStr;
  const raw = d.upvData || (ficha.createdAt||'').slice(0,10);
  if(raw && /^\d{4}-\d{2}-\d{2}/.test(raw)){
    const [y,m,dd] = raw.slice(0,10).split('-');
    dateStr = dd+'-'+m+'-'+y;
  } else {
    const now = new Date();
    dateStr = String(now.getDate()).padStart(2,'0')+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+now.getFullYear();
  }
  const cleanName = (d.nomeVitima||'SEM NOME').trim().toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_') || 'SEM_NOME';
  return cleanName+' - '+dateStr+'.pdf';
}


let toastTimer;
function toast(msg, isErr){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('err', !!isErr);
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2600);
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function processPhotoFile(file, opts){
  opts = opts||{};
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Falha ao ler a imagem.'));
    reader.onload = ()=>{ img.onerror=()=>reject(new Error('Arquivo de imagem inválido.')); img.src = reader.result; };
    img.onload = ()=>{
      const MAX = opts.max || 640;
      let w = img.naturalWidth, h = img.naturalHeight;
      if(w>h && w>MAX){ h = Math.round(h*MAX/w); w = MAX; }
      else if(h>=w && h>MAX){ w = Math.round(w*MAX/h); h = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width=w; canvas.height=h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      const dataUrl = canvas.toDataURL('image/jpeg', opts.quality || 0.82);
      const base64 = dataUrl.split(',')[1];
      resolve({base64, w, h});
    };
    reader.readAsDataURL(file);
  });
}

function confirmModal(title, body){
  return new Promise(resolve=>{
    const bg = document.createElement('div'); bg.id='modal-bg';
    bg.innerHTML = '<div id="modal">'+
      '<div class="mtitle">'+escapeHtml(title)+'</div>'+
      '<div class="mbody">'+escapeHtml(body)+'</div>'+
      '<div class="mrow"><button class="btn ghost" id="mcancel">Cancelar</button><button class="btn danger" id="mok">Confirmar</button></div>'+
    '</div>';
    document.body.appendChild(bg);
    bg.addEventListener('click', e=>{ if(e.target===bg){ bg.remove(); resolve(false);} });
    bg.querySelector('#mcancel').onclick = ()=>{ bg.remove(); resolve(false); };
    bg.querySelector('#mok').onclick = ()=>{ bg.remove(); resolve(true); };
  });
}

const CREST_W = 160, CREST_H = 160;
const WINANSI_MAP = { 0x2013:0x96, 0x2014:0x97, 0x2022:0x95, 0x2026:0x85, 0x2018:0x27, 0x2019:0x27, 0x201C:0x22, 0x201D:0x22 };
function toLatin1(str){
  return String(str).split('').map(ch=>{
    const c = ch.charCodeAt(0);
    if(c<=255) return ch;
    if(WINANSI_MAP[c]) return String.fromCharCode(WINANSI_MAP[c]);
    return '?';
  }).join('');
}
function escPdf(str){
  return toLatin1(str).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
}

const HELV_BW = {32:278,33:333,34:474,35:556,36:556,37:889,38:722,39:238,40:333,41:333,42:389,43:584,44:278,45:333,46:278,47:278,48:556,49:556,50:556,51:556,52:556,53:556,54:556,55:556,56:556,57:556,58:333,59:333,60:584,61:584,62:584,63:611,64:975,65:722,66:722,67:722,68:722,69:667,70:611,71:778,72:722,73:278,74:556,75:722,76:611,77:833,78:722,79:778,80:667,81:778,82:722,83:667,84:611,85:722,86:667,87:944,88:667,89:667,90:611,91:333,92:278,93:333,94:584,95:556,96:333,97:556,98:611,99:556,100:611,101:556,102:333,103:611,104:611,105:278,106:278,107:556,108:278,109:889,110:611,111:611,112:611,113:611,114:389,115:556,116:333,117:611,118:556,119:778,120:556,121:556,122:500,123:389,124:280,125:389,126:584};
function charWidth(code, bold){
  const t = bold? HELV_BW : HELV_W;
  if(t[code]!=null) return t[code];
  if(code>=192 && code<=223) return bold?722:667; // maiúsculas acentuadas
  if(code>=224 && code<=255) return bold?611:556; // minúsculas acentuadas
  return bold?611:556;
}
function textWidthPts(str, size, bold){
  const s = toLatin1(str);
  let w=0;
  for(let i=0;i<s.length;i++) w += charWidth(s.charCodeAt(i), bold);
  return w*size/1000;
}
function wrapLine(text, maxWidthPts, size, bold){
  text = String(text==null?'':text);
  size = size||9; 
  if(textWidthPts(text,size,bold) <= maxWidthPts) return [text];
  const words = text.split(' ');
  const lines=[]; let cur='';
  words.forEach(w=>{
    const trial = cur? cur+' '+w : w;
    if(cur && textWidthPts(trial,size,bold) > maxWidthPts){ lines.push(cur); cur=w; }
    else cur = trial;
  });
  if(cur) lines.push(cur);
  // segurança: se uma "palavra" isolada ainda for mais larga que a coluna, quebra por caractere
  const out=[];
  lines.forEach(ln=>{
    if(textWidthPts(ln,size,bold) <= maxWidthPts){ out.push(ln); return; }
    let chunk='';
    for(const ch of ln){
      const trial = chunk+ch;
      if(chunk && textWidthPts(trial,size,bold) > maxWidthPts){ out.push(chunk); chunk=ch; }
      else chunk = trial;
    }
    if(chunk) out.push(chunk);
  });
  return out;
}

/* =========================================================
   PDF — núcleo comum (montagem do arquivo) + utilitários de texto
   ========================================================= */
function wrapMulti(text, maxW, size, bold){
  const out = [];
  String(text==null?'':text).replace(/\t/g,'  ').split(/\r?\n/).forEach(par=>{
    if(par==='') out.push('');
    else wrapLine(par, maxW, size, bold).forEach(l=>out.push(l));
  });
  return out.length ? out : [''];
}
/* quebra uma lista de itens ("[X] Asfalto", "[ ] Trilha"...) respeitando a largura */
function wrapItems(items, maxW, size){
  const lines = []; let cur = '';
  items.forEach(it=>{
    const trial = cur ? cur+'    '+it : it;
    if(cur && textWidthPts(trial, size, false) > maxW){ lines.push(cur); cur = it; }
    else cur = trial;
  });
  if(cur) lines.push(cur);
  const out = [];
  lines.forEach(l=>{ wrapLine(l, maxW, size, false).forEach(x=>out.push(x)); });
  return out.length ? out : [''];
}

/* pageStreams: array de strings de conteúdo; images: [{name,w,h,b64}] (JPEG) */
function assemblePdf(opts){
  const objects = [];
  function addObj(c){ objects.push(c); return objects.length; }
  const fontReg  = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const fontBold = addObj('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');

  const xobj = [];
  (opts.images||[]).forEach(im=>{
    const bin = atob(im.b64);
    const n = addObj('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+bin.length+' >>\nstream\n'+bin+'\nendstream');
    xobj.push('/'+im.name+' '+n+' 0 R');
  });
  const resources = '<< /Font << /F1 '+fontReg+' 0 R /F2 '+fontBold+' 0 R >> /XObject << '+xobj.join(' ')+' >> >>';

  const pageNums = [];
  opts.pageStreams.forEach(s=>{
    const cnt = addObj('<< /Length '+s.length+' >>\nstream\n'+s+'endstream');
    pageNums.push(addObj('<< /Type /Page /Parent PAGES_REF /Resources '+resources+' /MediaBox [0 0 '+PDF_W+' '+PDF_H+'] /Contents '+cnt+' 0 R >>'));
  });
  const pagesNum = addObj('<< /Type /Pages /Kids ['+pageNums.map(n=>n+' 0 R').join(' ')+'] /Count '+pageNums.length+' >>');
  pageNums.forEach(n=>{ objects[n-1] = objects[n-1].replace('PAGES_REF', pagesNum+' 0 R'); });
  const catalogNum = addObj('<< /Type /Catalog /Pages '+pagesNum+' 0 R >>');
  const infoNum = addObj('<< /Producer (CBMES Busca de Pessoas Perdidas) /Title ('+escPdf(opts.title||'CBMES')+') /Keywords ('+opts.keywords+') >>');

  let out = '%PDF-1.4\n%\xE2\xE3\xCF\xD3\n';
  const offsets = [];
  objects.forEach((c,i)=>{ offsets.push(out.length); out += (i+1)+' 0 obj\n'+c+'\nendobj\n'; });
  const xrefOffset = out.length;
  out += 'xref\n0 '+(objects.length+1)+'\n0000000000 65535 f \n';
  offsets.forEach(off=>{ out += String(off).padStart(10,'0')+' 00000 n \n'; });
  out += 'trailer\n<< /Size '+(objects.length+1)+' /Root '+catalogNum+' 0 R /Info '+infoNum+' 0 R >>\n';
  out += 'startxref\n'+xrefOffset+'\n%%EOF';

  const bytes = new Uint8Array(out.length);
  for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 0xFF;
  return bytes;
}

function encodeKeywords(marker, data){
  const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(data))));
  return marker+b64+'|END|';
}

/* ---- leitura de PDFs gerados por esta ferramenta (Questionário ou Guia) ---- */
function importAnyPdf(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('Falha ao ler o arquivo.'));
    reader.onload = ()=>{
      try{
        const bytes = new Uint8Array(reader.result);
        let raw='';
        const CH = 0x8000;
        for(let i=0;i<bytes.length;i+=CH) raw += String.fromCharCode.apply(null, bytes.subarray(i, i+CH));
        const iG = raw.lastIndexOf('GUIA_V1:'), iQ = raw.lastIndexOf('FICHA_V1:');
        if(iG===-1 && iQ===-1) throw new Error('Este PDF não foi gerado por esta ferramenta.');
        const kind = iG > iQ ? 'guia' : 'q';
        const marker = kind==='guia' ? 'GUIA_V1:' : 'FICHA_V1:';
        const idx = kind==='guia' ? iG : iQ;
        const endIdx = raw.indexOf('|END|', idx);
        if(endIdx===-1) throw new Error('Dados incompletos neste PDF.');
        const b64 = raw.substring(idx+marker.length, endIdx);
        const data = JSON.parse(decodeURIComponent(escape(atob(b64))));
        if(!data || typeof data!=='object') throw new Error('Dados inválidos neste PDF.');
        resolve({kind, data});
      }catch(err){ reject(err); }
    };
    reader.readAsArrayBuffer(file);
  });
}

function buildMainSectionsData(ficha){
  const secs = [];
  SECTIONS.forEach(sec=>{
    const relevant = sec.fields.filter(f=> f.t!=='photo' && !f.cover);
    if(!relevant.length) return;
    const rows = [];
    relevant.forEach(f=>{
      const v = ficha.data[f.k];
      if(f.t==='bool'){
        rows.push({label:f.l, value: v==='sim'?'Sim':v==='nao'?'Não':'—'});
      } else if(f.t==='booldetail'){
        const cur = v||{};
        let val = cur.val==='sim'?'Sim':cur.val==='nao'?'Não':'—';
        if(cur.val==='sim' && cur.detail) val += '   —   '+(f.dl||'Descrever')+': '+cur.detail;
        rows.push({label:f.l, value:val});
      } else if(v){
        rows.push({label:f.l, value:String(v)});
      }
    });
    if(!rows.length) rows.push({label:'—', value:'(sem informações preenchidas nesta seção)', muted:true});
    secs.push({letter:secLabel(sec), title:sec.title, rows});
  });
  return secs;
}

/* Achata seções/linhas em itens de UMA linha de texto cada, para permitir
   quebra de página em QUALQUER linha — nenhum parágrafo, por maior que
   seja, consegue ultrapassar a margem inferior da página. */
function buildFlowItems(sections){
  const items = [];
  sections.forEach(sec=>{
    items.push({type:'header', section:sec});
    sec.rows.forEach(row=>{
      const labelLines = wrapMulti(row.label, MC_LABEL_W-6, 8.3, false);
      const valueLines = wrapMulti(row.value, MC_VALUE_W, 9, false);
      const n = Math.max(labelLines.length, valueLines.length, 1);
      for(let i=0;i<n;i++){
        items.push({ type:'line', label:labelLines[i]||'', value:valueLines[i]||'', first:i===0, last:i===n-1, muted:!!row.muted });
      }
    });
    items.push({type:'gap'});
  });
  return items;
}

function layoutFlowPages(items){
  const pages=[]; let cur=[]; let y=CONTENT_TOP; let currentSection=null;
  function newPage(repeatHeader){
    if(cur.length) pages.push(cur);
    cur=[]; y=CONTENT_TOP;
    if(repeatHeader && currentSection){
      cur.push({type:'header', section:currentSection, continued:true, y});
      y -= SEC_HEADER_H;
    }
  }
  items.forEach(item=>{
    if(item.type==='header'){
      currentSection = item.section;
      if(y-SEC_HEADER_H-LINE_H < CONTENT_BOTTOM) newPage(false);
      cur.push({type:'header', section:item.section, continued:false, y});
      y -= SEC_HEADER_H;
      return;
    }
    if(item.type==='gap'){ y -= 7; return; }
    const h = LINE_H + (item.first?FIRST_LINE_EXTRA:0);
    if(y-h < CONTENT_BOTTOM) newPage(true);
    cur.push(Object.assign({}, item, {y}));
    y -= h;
  });
  if(cur.length) pages.push(cur);
  if(!pages.length) pages.push([]);
  return pages;
}
function drawSectionHeader(pb, y, section, continued){
  pb.rectFill(MC_X, y-SEC_HEADER_H, MC_W, SEC_HEADER_H, [240,241,243]);
  pb.rectFill(MC_X, y-SEC_HEADER_H, 20, SEC_HEADER_H, COLOR.dark);
  pb.text(MC_X+5, y-SEC_HEADER_H+6.5, section.letter, {size:8, bold:true, color:COLOR.accent});
  pb.text(MC_X+27, y-SEC_HEADER_H+6.5, section.title.toUpperCase()+(continued?'  ·  continuação':''), {size:8.2, bold:true, color:[40,40,40]});
}

function drawSidebar(pb, ficha, imgDims){

function drawPage(pb, ficha, imgDims, items, pageNum, totalPages){
  drawBrandHeader(pb, 'FORMULÁRIO - PESSOA PERDIDA');

  drawSidebar(pb, ficha, imgDims);

  items.forEach(item=>{
    if(item.type==='header'){ drawSectionHeader(pb, item.y, item.section, item.continued); return; }
    const labelColor = item.muted? COLOR.textDim : [110,104,102];
    const valueColor = item.muted? COLOR.textDim : COLOR.text;
    if(item.label) pb.text(MC_X, item.y-9, item.label, {size:8.3, color:labelColor});
    if(item.value) pb.text(MC_VALUE_X, item.y-9, item.value, {size:9, color:valueColor});
    if(item.last) pb.rectFill(MC_X, item.y-LINE_H+1, MC_W, 0.6, COLOR.line);
  });

  pb.text(MARGIN, 16, 'CBMES — Formulário - Pessoa Perdida  ·  ID '+ficha.id.slice(-8), {size:7, color:[150,145,144]});
  pb.text(PDF_W-90, 16, 'Pág. '+pageNum+'/'+totalPages, {size:7.5, color:COLOR.textDim});
}



function buildPdf(ficha){
  const images = [{name:'ImCrest', w:CREST_W, h:CREST_H, b64:CREST_JPEG_B64}];
  let imgW=0, imgH=0;
  const foto = ficha.data.foto;
  if(foto && foto.base64){
    imgW = foto.w; imgH = foto.h;
    images.push({name:'Im1', w:imgW, h:imgH, b64:foto.base64});
  }
  const pages = layoutFlowPages(buildFlowItems(buildMainSectionsData(ficha)));
  const total = pages.length;
  const pageStreams = pages.map((items,i)=>{
    const pb = new PageBuilder();
    drawPage(pb, ficha, {imgW,imgH}, items, i+1, total);
    return pb.stream();
  });
  return assemblePdf({
    pageStreams, images,
    title:'Formulario - Pessoa Perdida',
    keywords: encodeKeywords('FICHA_V1:', ficha.data)
  });
}

function marks(opts, selected){
  return opts.map(o=> (selected.includes(o) ? '[X] ' : '[  ] ')+o);
}

function buildGuiaItems(g){
  const d = g.data;
  const items = [];
  const images = [];
  let imgN = 0;

  function row(label, value, o){
    o = o||{};
    const labelLines = wrapMulti(label, GP_LABEL_W-10, 8.3, false);
    const valueLines = o.list ? wrapItems(o.list, GP_VW, 9) : wrapMulti(value, GP_VW, 9, !!o.bold);
    const n = Math.max(labelLines.length, valueLines.length, 1);
    for(let i=0;i<n;i++){
      items.push({type:'line', label:labelLines[i]||'', value:valueLines[i]||'', last:i===n-1,
        muted: !!o.muted, bold: !!o.bold, color:o.color||null});
    }
  }
  function textRow(label, value, o){
    const v = (value==null?'':String(value)).trim();
    row(label, v || '—', Object.assign({}, o||{}, v ? {} : {muted:true}));
  }
  function header(num, text){ items.push({type:'ficha', num, text}); }
  function metaLine(){
    const parts = [];
    parts.push('Data: '+(fmtDateBR(d.data)||'—'));
    parts.push('Hora: '+(d.hora||'—'));
    parts.push('Ocorrência nº: '+(d.nOcorrencia||'—'));
    parts.push('Canal de rádio: '+(d.canal||'—'));
    items.push({type:'meta', text: parts.join('      ')});
  }

  /* ---- resumo ---- */
  header('', 'RESUMO DA OCORRÊNCIA');
  metaLine();
  if(guiaIsCritical(d)){
    const lines = wrapMulti('PERFIL CRÍTICO — resposta de máxima urgência. Acionar o CERD imediatamente (POP BAR-001), priorizar transporte aéreo e manter a busca ininterrupta, diurna e noturna.', GP_W-20, 9, true);
    items.push({type:'alert', lines, h: lines.length*11.5+10});
  }
  const nm = guiaVictimName(d);
  textRow('Desaparecido', nm + (d.idade && d.nomeCompleto ? ' — '+d.idade+' anos' : ''), {bold:true});
  textRow('Local', [d.refArea, d.municipio].filter(Boolean).join(' — '));
  textRow('Enquadramento', d.enquadramento);
  textRow('Perfil crítico', d.perfilCritico==='sim' ? 'Sim'+(gArr(d.perfilCriticoTipos).length?' — '+gArr(d.perfilCriticoTipos).join(', '):'') : d.perfilCritico==='nao' ? 'Não' : '');
  textRow('Categoria adotada', guiaCategoriaTexto(d) + (d.categoriaMais ? '  ('+d.categoriaMais+')' : ''));
  const us = urgencySummary(d);
  textRow('Resposta adotada', (d.respostaAdotada||'') + (us.n===us.total ? '   (soma '+us.sum+' — matriz sugere: '+us.band+')' : ''));
  textRow('Apoio solicitado', gArr(d.solicito).join(', '));
  items.push({type:'gap'});

  /* ---- fichas ---- */
  GUIA_FICHAS.forEach(fic=>{
    header(fic.id, 'FICHA '+fic.id+' — '+fic.title.toUpperCase());
    metaLine();
    let color = GROUP_COLORS.neutro;
    const done = new Set();
    fic.fields.forEach((f, idx)=>{
      if(done.has(f)) return;
      if(!isShown(f, d)) return;

      if(f.t==='group'){ color = GROUP_COLORS[f.c] || GROUP_COLORS.neutro; items.push({type:'group', text:f.l, color}); return; }
      if(f.t==='info'){ return; }
      if(f.t==='alerta'){ return; }

      if(f.t==='matrix'){
        const u = d.urg||{}, notas = d.urgNotas||{};
        URG_FACTORS.forEach(fc=>{
          const n = parseInt(u[fc.k],10);
          let val = (n>=1 && n<=4) ? n+' — '+fc.o[n-1] : '';
          if(val && (notas[fc.k]||'').trim()) val += '   ·   Nota: '+notas[fc.k].trim();
          textRow(fc.l, val, {color});
        });
        const s = urgencySummary(d);
        textRow('Soma dos fatores (8 a 32)', s.n ? s.sum+(s.band?'  —  '+s.band:'  ('+s.n+' de '+s.total+' fatores)') : '', {bold:true, color});
        if(s.ones>0) row('Regra de exceção', 'Há fator pontuado como 1: pode exigir resposta de emergência, independentemente da soma.', {muted:true, color});
        return;
      }
      if(f.t==='raios'){
        const any = d.r25||d.r50||d.r75||d.r95;
        const ref = d.raiosPerfil ? (d.raiosPerfil==='OUTROS' ? 'Outros' : ((VICTIM_PROFILES.find(p=>p.key===d.raiosPerfil)||{}).label||'')) + (d.raiosPerfil!=='OUTROS' ? (d.raiosTerreno==='plana' ? ' · área não montanhosa' : ' · área montanhosa') : '') : '';
        textRow('Categoria de referência', ref, {color});
        textRow('Raio a partir do UPV (km)', any ? '25%: '+(d.r25||'—')+'      50%: '+(d.r50||'—')+'      75%: '+(d.r75||'—')+'      95%: '+(d.r95||'—') : '', {color, bold:!!any});
        return;
      }
      if(f.t==='missions'){
        const ms = gArr(d.missoes).map((m,i)=>({m:m||{}, n:i+1})).filter(x=>Object.keys(x.m).some(k=>(x.m[k]||'').toString().trim()));
        if(!ms.length){ textRow('Missões', '', {color}); return; }
        items.push({type:'tablehead'});
        ms.forEach(({m,n})=>{
          const cells = {
            n:[String(n)], missao:wrapMulti(m.missao||'',GP_COLS[1].w-8,8.3,false), tipo:[m.tipo||''],
            equipe:wrapMulti(m.equipe||'',GP_COLS[3].w-8,8.3,false), saida:[m.saida||''], retorno:[m.retorno||''],
            pod:[m.pod? (String(m.pod).replace(/%$/,'')+'%') : ''], resultado:wrapMulti(m.resultado||'',GP_COLS[7].w-8,8.3,false)
          };
          const nl = Math.max.apply(null, Object.keys(cells).map(k=>cells[k].length));
          for(let i=0;i<nl;i++){
            const c = {}; Object.keys(cells).forEach(k=>{ c[k] = cells[k][i]||''; });
            items.push({type:'tline', cells:c, last:i===nl-1});
          }
        });
        items.push({type:'gap'});
        return;
      }
      if(f.t==='photos'){
        const list = gArr(d[f.k]);
        textRow(f.l, list.length ? list.length+(list.length>1?' fotos anexadas':' foto anexada') : '', {color});
        list.forEach(p=>{
          imgN++;
          const name = 'ImG'+imgN;
          images.push({name, w:p.w, h:p.h, b64:p.base64});
          const sc = Math.min(1.5, 420/p.w, 300/p.h);
          items.push({type:'image', name, dw:p.w*sc, dh:p.h*sc, h:p.h*sc});
        });
        return;
      }
      if(f.row){
        const mates = fic.fields.filter(x=>x.row===f.row && isShown(x,d));
        mates.forEach(x=>done.add(x));
        const lbl = mates.map(x=>x.l.replace(/\?$/,'')).join(' / ');
        const vals = mates.map(x=>guiaPlain(x,d));
        textRow(lbl, vals.some(Boolean) ? vals.map(v=>v||'—').join('    ·    ') : '', {color});
        return;
      }
      if(f.t==='checks'){
        row(f.l, '', {list: marks(f.o, gArr(d[f.k])), color});
        return;
      }
      if(f.t==='radio'){
        row(f.l, '', {list: marks(f.o, d[f.k]?[d[f.k]]:[]), color});
        return;
      }
      if(f.t==='bool'){
        const v = d[f.k];
        row(f.l, '', {list: [(v==='sim'?'[X]':'[  ]')+' Sim', (v==='nao'?'[X]':'[  ]')+' Não'], color});
        return;
      }
      textRow(f.l, guiaPlain(f, d), {color});
    });
    items.push({type:'gap'});
  });
  return {items, images};
}

function layoutGuiaPages(items){
  const pages = []; let cur = []; let y = GP_TOP;
  let curFicha = null, tableHead = null;
  function newPage(){
    if(cur.length) pages.push(cur);
    cur = []; y = GP_TOP;
    if(curFicha){ cur.push({type:'ficha', num:curFicha.num, text:curFicha.text, cont:true, y}); y -= GP_FICHA_H+4; }
    if(tableHead){ cur.push({type:'tablehead', y, cont:true}); y -= GP_TH_H; }
  }
  items.forEach(it=>{
    if(it.type!=='tline' && it.type!=='tablehead' && it.type!=='gap') tableHead = null;
    if(it.type==='ficha'){
      if(y-(GP_FICHA_H+4)-GP_META_H-GP_GROUP_H-GP_LH*2 < GP_BOTTOM){ curFicha=null; newPage(); }
      curFicha = it;
      cur.push(Object.assign({}, it, {y})); y -= GP_FICHA_H+4;
    } else if(it.type==='meta'){
      cur.push(Object.assign({}, it, {y})); y -= GP_META_H;
    } else if(it.type==='alert'){
      if(y-it.h-6 < GP_BOTTOM) newPage();
      cur.push(Object.assign({}, it, {y})); y -= it.h+6;
    } else if(it.type==='group'){
      if(y-GP_GROUP_H-GP_LH*2 < GP_BOTTOM) newPage();
      cur.push(Object.assign({}, it, {y})); y -= GP_GROUP_H+2;
    } else if(it.type==='line'){
      const h = GP_LH + (it.last?GP_AFTER:0);
      if(y-h < GP_BOTTOM) newPage();
      cur.push(Object.assign({}, it, {y})); y -= h;
    } else if(it.type==='tablehead'){
      if(y-GP_TH_H-GP_LH*2 < GP_BOTTOM) newPage();
      tableHead = it;
      cur.push(Object.assign({}, it, {y})); y -= GP_TH_H;
    } else if(it.type==='tline'){
      const h = GP_LH + (it.last?GP_AFTER:0);
      if(y-h < GP_BOTTOM) newPage();
      cur.push(Object.assign({}, it, {y})); y -= h;
    } else if(it.type==='image'){
      if(y-it.h-10 < GP_BOTTOM) newPage();
      cur.push(Object.assign({}, it, {y})); y -= it.h+10;
    } else if(it.type==='gap'){
      y -= 7;
    }
  });
  if(cur.length) pages.push(cur);
  if(!pages.length) pages.push([]);
  return pages;
}

    } else if(it.type==='tline'){
      let x = GP_X;
      GP_COLS.forEach((c,i)=>{
        const v = it.cells[c.k];

    } else if(it.type==='image'){

  });
  pb.text(MARGIN, 16, 'CBMES — Guia de Comando  ·  ID '+g.id.slice(-8), {size:7, color:[150,145,144]});
  pb.text(PDF_W-90, 16, 'Pág. '+pageNum+'/'+total, {size:7.5, color:COLOR.textDim});
}

function buildGuiaPdf(g){
  const {items, images} = buildGuiaItems(g);
  const pages = layoutGuiaPages(items);
  const total = pages.length;
  const pageStreams = pages.map((its,i)=>{
    const pb = new PageBuilder();
    drawGuiaPage(pb, g, its, i+1, total);
    return pb.stream();
  });
  return assemblePdf({
    pageStreams,
    images: [{name:'ImCrest', w:CREST_W, h:CREST_H, b64:CREST_JPEG_B64}].concat(images),
    title: 'Guia de Comando - Pessoa Perdida',
    keywords: encodeKeywords('GUIA_V1:', g.data)
  });
}

function safeNamePart(name){
  return (name||'SEM NOME').trim().toUpperCase()
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^\w\- ]+/g,'').replace(/\s+/g,'_') || 'SEM_NOME';
}
function buildGuiaFileName(g){
  const d = g.data;
  let dateStr;
  const raw = d.data || (g.createdAt||'').slice(0,10);
  if(raw && /^\d{4}-\d{2}-\d{2}/.test(raw)){
    const [y,m,dd] = raw.slice(0,10).split('-');
    dateStr = dd+'-'+m+'-'+y;
  } else {
    const now = new Date();
    dateStr = String(now.getDate()).padStart(2,'0')+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+now.getFullYear();
  }
  let nm = guiaVictimName(d);
  if(!nm && d.nOcorrencia) nm = 'OCORRENCIA '+d.nOcorrencia;
  return 'GUIA_'+safeNamePart(nm)+' - '+dateStr+'.pdf';
}

function loadPdfLib(){
  if(window.PDFLib) return Promise.resolve(window.PDFLib);

  _pdfLibPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'pdf-lib.min.js';
    s.onload = ()=> window.PDFLib ? resolve(window.PDFLib) : reject(new Error('Biblioteca pdf-lib inválida.'));

}

const GO_SOLICITO = {
  'CERD':[199,244,524,550], 'Cão de faro (K9)':[379,424,524,550], 'NOTAER':[514,568,524,550],
  'Guarnição de apoio':[199,244,550,576], 'Equipe de mergulho':[379,424,550,576], 'SAMU':[514,568,550,576],
  'PCES / PMES / Defesa Civil':[199,244,576,602], 'Drone':[379,424,576,602], 'Outros':[514,568,576,602]
};
const GO_MATRIX_X = [154,244,334,424,514];
const GO_MATRIX_Y = [[375,400],[400,435],[435,459],[459,484],[484,509],[509,533],[533,558],[558,573]];
const GO_MISSION_COLS = [['missao',55,244],['tipo',244,289],['equipe',289,379],['saida',379,424],['retorno',424,469],['pod',469,514],['resultado',514,568]];

function goSanitize(s){
  return String(s==null?'':s).replace(/\t/g,'  ').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/…/g,'...')
    .replace(/[^\n\x20-\x7E -ÿ]/g,'?');
}

async function buildGuiaOriginalPdf(g){
  const PL = await loadPdfLib();
  const {PDFDocument, StandardFonts, rgb, PDFName, PDFString} = PL;
  const resp = await fetch(STATIC_FILES.guiaBranco.file, {cache:'no-cache'});
  const ctype = (resp.headers.get('content-type')||'').toLowerCase();
  if(resp.status===404 || (resp.ok && ctype.indexOf('html')>=0)) throw new Error('Arquivo "'+STATIC_FILES.guiaBranco.file+'" não encontrado no servidor (envie-o ao GitHub, na mesma pasta do index.html).');
  if(!resp.ok) throw new Error('HTTP '+resp.status);
  const doc = await PDFDocument.load(await resp.arrayBuffer());
  const font = await doc.embedFont(StandardFonts.Helvetica);
  const bold = await doc.embedFont(StandardFonts.HelveticaBold);
  const pages = doc.getPages();
  const PH = pages[0].getHeight();
  const d = g.data || {};
  const ink = rgb(GO_INK[0],GO_INK[1],GO_INK[2]);
  const annex = [];   /* {label,text} que não coube */
  const gaArr = v => Array.isArray(v) ? v : [];

  const wrapTo = (text, w, size)=>{
    const out = [];
    text.split('\n').forEach(par=>{
      if(par===''){ out.push(''); return; }
      let cur = '';
      par.split(/\s+/).forEach(word=>{
        const trial = cur ? cur+' '+word : word;
        if(font.widthOfTextAtSize(trial,size) <= w) cur = trial;
        else{
          if(cur) out.push(cur);
          /* palavra maior que a linha: quebra por caractere */
          let rest = word;
          while(font.widthOfTextAtSize(rest,size) > w && rest.length>1){
            let n = rest.length;
            while(n>1 && font.widthOfTextAtSize(rest.slice(0,n),size) > w) n--;
            out.push(rest.slice(0,n)); rest = rest.slice(n);
          }
          cur = rest;
        }
      });
      out.push(cur);
    });
    return out;
  };

  function putText(pg, c, raw, label){
    const text = goSanitize(raw).trim();
    if(!text) return;
    const pad = 2.5, w = c.x1-c.x0-pad*2, h = c.b-c.t;
    /* 1) uma linha, encolhendo até 5.5 */
    for(let s=8; s>=5.5; s-=0.5){
      if(!text.includes('\n') && font.widthOfTextAtSize(text,s) <= w){
        const y = PH - (c.t + h/2) - s*0.35;
        pg.drawText(text,{x:c.x0+pad, y, size:s, font, color:ink}); return;
      }
    }
    /* 2) várias linhas */
    for(let s=8; s>=5; s-=0.5){
      const lh = s*1.15, lines = wrapTo(text,w,s);
      if(lines.length*lh <= h-1){
        let y = PH - c.t - 1.5 - s*0.85;
        if(lines.length===1) y = PH - (c.t+h/2) - s*0.35;
        lines.forEach((ln,i)=>{ if(ln) pg.drawText(ln,{x:c.x0+pad, y:y-i*lh, size:s, font, color:ink}); });
        return;
      }
    }
    /* 3) não coube: escreve o início e manda o texto completo para o anexo */
    const s = 5.5, lh = s*1.15, maxL = Math.max(1, Math.floor((h-1)/lh));
    const lines = wrapTo(text,w,s).slice(0,maxL);
    let last = lines[lines.length-1] || '';
    while(last.length>1 && font.widthOfTextAtSize(last+' (anexo)',s) > w) last = last.slice(0,-1);
    lines[lines.length-1] = last+' (anexo)';
    lines.forEach((ln,i)=> pg.drawText(ln,{x:c.x0+pad, y:PH-c.t-1.5-s*0.85-i*lh, size:s, font, color:ink}));
    annex.push({label, text});
  }
  function mark(pg, cx, cy){
    const s = 8, tw = bold.widthOfTextAtSize('X',s);
    pg.drawText('X',{x:cx-tw/2, y:PH-cy-s*0.36, size:s, font:bold, color:ink});
  }
  function markCell(pg, x0,x1,t,b){ mark(pg,(x0+x1)/2,(t+b)/2); }

  /* texto */
  GO_TEXT.forEach(c=>{
    const v = c.fn(d);
    if(v==null || v==='') return;
    putText(pages[c.p-1], {x0:c.x0,x1:c.x1,t:c.t,b:c.b}, String(v), c.label);
  });

  /* caixas ( ) */
  const optsOf = key=>{
    for(const f of GUIA_FICHAS){ const x = f.fields.find(q=>q.k===key); if(x && x.o) return x.o; }
    return [];
  };
  Object.keys(GO_BOXES).forEach(key=>{
    const spec = GO_BOXES[key], pg = pages[spec.p-1], v = d[key];
    if(v==null || v==='' ) return;
    const opts = optsOf(key);
    if(opts.length){
      const sel = Array.isArray(v) ? v : [v];
      sel.forEach(x=>{ const i = opts.indexOf(x); if(i>=0 && spec.pts[i]) mark(pg, spec.pts[i][0], spec.pts[i][1]); });
    }else{ /* bool */
      if(spec.pts.length===1){ if(v==='sim') mark(pg, spec.pts[0][0], spec.pts[0][1]); }
      else if(v==='sim') mark(pg, spec.pts[0][0], spec.pts[0][1]);
      else if(v==='nao') mark(pg, spec.pts[1][0], spec.pts[1][1]);
    }
  });

  /* apoio solicitado */
  gaArr(d.solicito).forEach(x=>{ const c = GO_SOLICITO[x]; if(c) markCell(pages[0], c[0],c[1],c[2],c[3]); });

  /* matriz de urgência */
  const urg = d.urg || {};
  URG_FACTORS.forEach((f,i)=>{
    const v = parseInt(urg[f.k],10);
    if(v>=1 && v<=4){
      const x0 = GO_MATRIX_X[v-1], x1 = GO_MATRIX_X[v], t = GO_MATRIX_Y[i][0], b = GO_MATRIX_Y[i][1];
      pages[2].drawRectangle({x:x0+0.5, y:PH-b+0.5, width:x1-x0-1, height:b-t-1, color:rgb(1,0.85,0.2), opacity:0.45, borderColor:ink, borderWidth:1});
    }
    const note = (d.urgNotas||{})[f.k];
    if(note) putText(pages[2], {x0:GO_MATRIX_X[4],x1:568,t:GO_MATRIX_Y[i][0],b:GO_MATRIX_Y[i][1]}, note, 'Nota — '+f.l);
  });
  const us = urgencySummary(d);
  if(us.n>0) putText(pages[2], {x0:244,x1:334,t:573,b:597}, us.n===us.total ? String(us.sum) : (us.sum+' (parcial)'), 'Soma dos fatores');

  /* missões */
  const miss = gaArr(d.missoes).filter(m=>m && Object.values(m).some(x=>x));
  miss.slice(0,10).forEach((m,i)=>{
    const t = 87+28*i, b = t+28;
    GO_MISSION_COLS.forEach(c=>{
      let v = m[c[0]]; if(!v) return;
      if(c[0]==='pod') v = String(v).replace(/%$/,'')+'%';
      putText(pages[4], {x0:c[1],x1:c[2],t,b}, String(v), 'Missão '+(i+1)+' — '+c[0]);
    });
  });
  const extraMiss = miss.slice(10);

  /* fotos de croqui */
  const embedPhoto = async p=> doc.embedJpg(Uint8Array.from(atob(p.base64), ch=>ch.charCodeAt(0)));
  async function fitPhoto(pg, p, x0,x1,t,b){
    const img = await embedPhoto(p);
    const bw = x1-x0-4, bh = b-t-4, sc = Math.min(bw/p.w, bh/p.h);
    const w = p.w*sc, h = p.h*sc;
    pg.drawImage(img,{x:x0+2+(bw-w)/2, y:PH-b+2+(bh-h)/2, width:w, height:h});
  }
  const fotosAcesso = gaArr(d.croquiAcesso), fotosArea = gaArr(d.croquiArea);
  if(fotosAcesso.length) await fitPhoto(pages[0], fotosAcesso[0], 29,568,618,680);
  if(fotosArea.length) await fitPhoto(pages[3], fotosArea[0], 29,568,282,652);

  /* anexos */
  const AW = pages[0].getWidth(), AH = PH, AM = 36;
  const hdr = (pg, title)=>{
    pg.drawRectangle({x:0,y:AH-46,width:AW,height:46,color:rgb(0.6,0.1,0.1)});
    pg.drawText('GUIA DE COMANDO — '+goSanitize(title),{x:AM,y:AH-29,size:12,font:bold,color:rgb(1,1,1)});
  };
  if(annex.length || extraMiss.length || d.solicitoObs){
    const extra = annex.slice();
    if(d.solicitoObs && d.solicitoObs.trim()) extra.push({label:'Apoio solicitado — horário do acionamento / observações', text:d.solicitoObs.trim()});
    let pg = null, y = 0;
    const newPage = title=>{ pg = doc.addPage([AW,AH]); hdr(pg,title); y = AH-70; };
    const need = hh=>{ if(!pg || y-hh < 40) newPage('Anexo (continuação)'); };
    if(extra.length){
      newPage('Anexo — textos e informações complementares');
      for(const e of extra){
        need(30);
        pg.drawText(goSanitize(e.label),{x:AM,y,size:9,font:bold,color:rgb(0.2,0.2,0.2)}); y -= 13;
        for(const ln of wrapTo(goSanitize(e.text), AW-AM*2, 9.5)){
          need(14);
          if(ln) pg.drawText(ln,{x:AM,y,size:9.5,font,color:ink}); y -= 12.5;
        }
        y -= 8;
      }
    }
    if(extraMiss.length){
      newPage('Anexo — missões adicionais (a partir da 11ª)');
      const cols = [['Nº',30],['Missão / segmento',170],['Tipo',34],['Equipe',100],['Saída',38],['Retorno',40],['POD',34],['Resultado',77]];
      const draw = (vals,boldRow)=>{
        let x = AM; need(16);
        cols.forEach((c,ci)=>{
          pg.drawRectangle({x,y:y-14,width:c[1],height:14,borderColor:rgb(0.6,0.6,0.6),borderWidth:0.5,color:boldRow?rgb(0.9,0.9,0.9):undefined});
          let tx = goSanitize(vals[ci]||''), s=7.5;
          while(tx.length>1 && font.widthOfTextAtSize(tx,s) > c[1]-4) tx = tx.slice(0,-1);
          pg.drawText(tx,{x:x+2,y:y-10,size:s,font:boldRow?bold:font,color:boldRow?rgb(0,0,0):ink});
          x += c[1];
        });
        y -= 14;
      };
      draw(cols.map(c=>c[0]),true);
      extraMiss.forEach((m,i)=> draw([String(11+i),m.missao,m.tipo,m.equipe,m.saida,m.retorno,m.pod?String(m.pod).replace(/%$/,'')+'%':'',m.resultado],false));
    }
  }
  /* fotos ampliadas */
  const photoPages = [];
  if(fotosAcesso.length) photoPages.push(['Croqui do acesso (ampliado)', fotosAcesso]);
  if(fotosArea.length > 1) photoPages.push(['Croqui da área — fotos adicionais', fotosArea.slice(1)]);
  for(const [title,list] of photoPages){
    for(const p of list){
      const pg = doc.addPage([AW,AH]); hdr(pg,title);
      const img = await embedPhoto(p);
      const bw = AW-AM*2, bh = AH-46-AM*2, sc = Math.min(bw/p.w, bh/p.h);
      pg.drawImage(img,{x:AM+(bw-p.w*sc)/2, y:AM+(bh-p.h*sc)/2, width:p.w*sc, height:p.h*sc});
    }
  }

  /* metadados + dados para reimportação */
  doc.setTitle('Guia de Comando - Pessoa Perdida');
  let info = doc.context.lookup(doc.context.trailerInfo.Info);
  if(!info || !info.set){
    info = doc.context.obj({});
    doc.context.trailerInfo.Info = doc.context.register(info);
  }
  info.set(PDFName.of('Keywords'), PDFString.of(encodeKeywords('GUIA_V1:', d)));
  info.set(PDFName.of('Producer'), PDFString.of('CBMES Busca de Pessoas Perdidas'));
  return await doc.save({useObjectStreams:false});
}


/* =========================================================
   MOTOR DE FORMULÁRIO — serve ao Questionário e à Guia de Comando
   ========================================================= */
GUIA_FICHAS.forEach(f=>{ f.short = 'F'+f.id; });
function secLabel(s){ return s.short || SECTION_TITLE[s.id] || s.id; }

function isTrue(v){ return v==='sim' || (v && v.val==='sim'); }
function isShown(f, data){
  if(!f.showIf) return true;
  if(typeof f.showIf==='function') return !!f.showIf(data);
  return isTrue(data[f.showIf]);
}
function fieldHasValue(v, f){
  if(f && f.t==='booldetail') return !!(v && (v.val || v.detail));
  if(Array.isArray(v)) return v.length>0;
  return v!==undefined && v!==null && v!=='';
}
function sectionHasData(data, sec){
  if(GUIA_FICHAS.indexOf(sec)>=0) return guiaHasData(data, sec);
  return sec.fields.some(f=> fieldHasValue(data[f.k], f));
}

function renderSection(sec, ficha){
  const card = document.createElement('div');
  card.className='section-card';
  card.innerHTML = `<div class="section-head">
      <div class="let">${escapeHtml(secLabel(sec))}</div>
      <div><div class="ttl">${escapeHtml(sec.title)}</div>${sec.sub?`<div class="sub">${escapeHtml(sec.sub)}</div>`:''}</div>
    </div>`;

  const grid = document.createElement('div');
  const rows = {};
  sec.fields.forEach(f=>{
    if(f.row){
      rows[f.row] = rows[f.row] || [];
      rows[f.row].push(f);
    }
  });
  const rendered = new Set();

  sec.fields.forEach((f, idx)=>{
    const id = f.k || ('#'+idx);
    if(rendered.has(id)) return;
    if(!isShown(f, ficha.data)) return;

    if(f.row && rows[f.row].length>1 && rows[f.row].every(rf=>isShown(rf, ficha.data))){
      const rowFields = rows[f.row];
      const rowDiv = document.createElement('div');
      rowDiv.className='field-row'+(GUIA_FICHAS.indexOf(sec)>=0?' g2':'');
      rowFields.forEach(rf=>{ rowDiv.appendChild(renderField(rf, ficha)); rendered.add(rf.k); });
      grid.appendChild(rowDiv);
    } else {
      grid.appendChild(renderField(f, ficha));
      rendered.add(id);
    }
  });

  card.appendChild(grid);
  return card;
}

function helpHtml(f){
  return f.help ? `<div class="field-help">${escapeHtml(f.help)}</div>` : '';
}

function renderField(f, ficha){
  const wrap = document.createElement('div');
  wrap.className='field';
  const data = ficha.data;
  const val = data[f.k];
  const save = ()=>persist(ficha);

  if(f.t==='group'){
    wrap.className = 'g-group g-'+(f.c||'neutro');
    wrap.textContent = f.l;
    return wrap;
  }
  if(f.t==='info'){
    wrap.className = 'g-info'+(f.c?' '+f.c:'');
    wrap.textContent = f.x;
    return wrap;
  }
  if(f.t==='alerta') return renderAlerta(ficha);
  if(f.t==='matrix') return renderMatrix(ficha);
  if(f.t==='raios') return renderRaios(ficha);
  if(f.t==='missions') return renderMissions(ficha);

  if(f.t==='text' || f.t==='date' || f.t==='time'){
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label><input type="${f.t}" value="${escapeHtml(val||'')}">${helpHtml(f)}`;
    wrap.querySelector('input').oninput = (e)=>{ data[f.k]=e.target.value; save(); };
  }
  else if(f.t==='textarea'){
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label><textarea style="${f.big?'min-height:130px':''}">${escapeHtml(val||'')}</textarea>${helpHtml(f)}`;
    wrap.querySelector('textarea').oninput = (e)=>{ data[f.k]=e.target.value; save(); };
  }
  else if(f.t==='select'){
    const opts = ['<option value="">—</option>'].concat(f.opts.map(o=>`<option value="${escapeHtml(o)}" ${val===o?'selected':''}>${escapeHtml(o)}</option>`));
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label><select>${opts.join('')}</select>`;
    wrap.querySelector('select').onchange = (e)=>{ data[f.k]=e.target.value; save(); render(); };
  }
  else if(f.t==='bool'){
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label>${boolGroupHtml(val)}`;
    wireBool(wrap, v=>{ data[f.k]=v; save(); render(); });
  }
  else if(f.t==='radio'){
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label>
      <div class="opt-group">${f.o.map(o=>`<button type="button" class="opt-btn ${val===o?'active':''}" data-v="${escapeHtml(o)}">${escapeHtml(o)}</button>`).join('')}</div>${helpHtml(f)}`;
    wrap.querySelectorAll('.opt-btn').forEach(b=>{
      b.onclick = ()=>{ data[f.k] = (data[f.k]===b.dataset.v) ? '' : b.dataset.v; save(); render(); };
    });
  }
  else if(f.t==='checks'){
    const cur = gArr(val);
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label>
      <div class="chk-grid">${f.o.map((o,i)=>`<button type="button" class="chk ${cur.includes(o)?'on':''} ${(f.crit && i<f.crit)?'crit':''}" data-v="${escapeHtml(o)}"><span class="box">${cur.includes(o)?'✓':''}</span><span class="tx">${escapeHtml(o)}</span></button>`).join('')}</div>${helpHtml(f)}`;
    wrap.querySelectorAll('.chk').forEach(b=>{
      b.onclick = ()=>{
        const list = gArr(data[f.k]).slice();
        const i = list.indexOf(b.dataset.v);
        if(i>=0) list.splice(i,1); else list.push(b.dataset.v);
        data[f.k] = list; save(); render();
      };
    });
  }
  else if(f.t==='photos'){
    const list = gArr(val);
    const MAXP = 6;
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label>
      <div class="photos-grid">
        ${list.map((p,i)=>`<div class="ph"><img src="data:image/jpeg;base64,${p.base64}" alt=""><button type="button" class="ph-x" data-i="${i}" aria-label="Remover">×</button></div>`).join('')}
        ${list.length<MAXP ? `<button type="button" class="ph-add">+<span>Adicionar foto</span></button>` : ''}
      </div>
      <input type="file" accept="image/*" multiple class="ph-input" style="display:none">${helpHtml(f)}`;
    const input = wrap.querySelector('.ph-input');
    const add = wrap.querySelector('.ph-add');
    if(add) add.onclick = ()=> input.click();
    input.onchange = async ()=>{
      const files = Array.from(input.files||[]);
      if(!files.length) return;
      const cur = gArr(data[f.k]).slice();
      let skipped = 0;
      for(const file of files){
        if(cur.length>=MAXP){ skipped++; continue; }
        try{ cur.push(await processPhotoFile(file, {max:900, quality:0.78})); }
        catch(err){ toast('Não foi possível processar uma das imagens.', true); }
      }
      data[f.k] = cur; save(); render();
      if(skipped) toast('Limite de '+MAXP+' fotos por campo.', true);
    };
    wrap.querySelectorAll('.ph-x').forEach(b=>{
      b.onclick = ()=>{ const l = gArr(data[f.k]).slice(); l.splice(parseInt(b.dataset.i,10),1); data[f.k]=l; save(); render(); };
    });
  }
  else if(f.t==='photo'){
    const has = !!val;
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label>
      <div class="photo-field">
        ${has? `<img class="photo-thumb" src="data:image/jpeg;base64,${val.base64}">` : `<div class="photo-placeholder">SEM<br>FOTO</div>`}
        <div class="photo-actions">
          <button type="button" class="btn sm" id="btn-photo-pick">${has?'Trocar foto':'Adicionar foto'}</button>
          ${has? `<button type="button" class="btn sm danger" id="btn-photo-remove">Remover</button>` : ''}
          <div class="photo-hint">Aparece na capa do PDF gerado</div>
        </div>
        <div class="photo-perfil">
          <label>Perfil identificado</label>
          <input type="text" id="perfil-input" placeholder="Ex.: Idoso com Alzheimer, criança autista..." value="${escapeHtml(data.perfilIdentificado||'')}">
          <div class="hint">Se o bombeiro já reconhece o perfil antes de preencher o resto, ele aparece em destaque no PDF, logo abaixo do nome.</div>
        </div>
        <input type="file" accept="image/*" id="photo-input" style="display:none">
      </div>`;
    const input = wrap.querySelector('#photo-input');
    wrap.querySelector('#btn-photo-pick').onclick = ()=> input.click();
    wrap.querySelector('#perfil-input').oninput = (e)=>{ data.perfilIdentificado = e.target.value; save(); };
    input.onchange = async ()=>{
      const file = input.files[0];
      if(!file) return;
      try{
        const photo = await processPhotoFile(file);
        data[f.k] = photo; save(); render();
      }catch(err){ toast('Não foi possível processar a imagem.', true); }
    };
    const rm = wrap.querySelector('#btn-photo-remove');
    if(rm) rm.onclick = ()=>{ data[f.k]=null; save(); render(); };
  }
  else if(f.t==='booldetail'){
    const cur = val || {val:'', detail:''};
    wrap.innerHTML = `<label>${escapeHtml(f.l)}</label>${boolGroupHtml(cur.val)}
      <div class="bool-detail ${cur.val==='sim'?'':'hidden'}">
        <input type="text" placeholder="${escapeHtml(f.dl||'Descrever')}" value="${escapeHtml(cur.detail||'')}">
      </div>`;
    wireBool(wrap, v=>{
      const cur2 = data[f.k] || {val:'',detail:''};
      cur2.val = v;
      data[f.k]=cur2; save(); render();
    });
    const detailInput = wrap.querySelector('.bool-detail input');
    if(detailInput) detailInput.oninput = (e)=>{
      const cur2 = data[f.k] || {val:'',detail:''};
      cur2.detail = e.target.value;
      data[f.k]=cur2; save();
    };
  }
  return wrap;
}

function boolGroupHtml(val){
  return `<div class="bool-group">
    <div class="bool-btn sim ${val==='sim'?'active':''}" data-v="sim">Sim</div>
    <div class="bool-btn nao ${val==='nao'?'active':''}" data-v="nao">Não</div>
  </div>`;
}
function wireBool(wrap, cb){
  wrap.querySelectorAll('.bool-btn').forEach(btn=>{
    btn.onclick = ()=>{
      const cur = btn.classList.contains('active') ? '' : btn.dataset.v;
      cb(cur);
    };
  });
}

      <div class="urg-l">${escapeHtml(fc.l)}</div>

    </div>`;
  });
  const bandTxt = s.band ? `${s.band}` : `${s.n} de ${s.total} fatores respondidos`;
  html += `<div class="urg-sum ${s.band==='Emergência'?'em':s.band==='Mensurada'?'me':s.band?'av':''}">
      <div><span class="lbl">Soma dos fatores (8 a 32)</span><span class="big">${s.n?s.sum:'—'}</span></div>

      ${s.ones>0 ? `<div class="exc">Regra de exceção: qualquer fator isolado pontuado como 1 pode exigir resposta de emergência, independentemente da soma. A urgência é reavaliada a cada mudança de condição — sobretudo meteorologia e luz do dia.</div>`:''}
    </div>`;
  wrap.innerHTML = html;
  wrap.querySelectorAll('.urg-row').forEach(row=>{

  return wrap;
}

  wrap.className = 'raios';
  const hasAny = !!(d.r25||d.r50||d.r75||d.r95);
  let autoMsg = '';
  if(!hasAny && !d.raiosPerfil){
    const key = guiaProfileKey(d);
    if(key){
      d.raiosPerfil = key; d.raiosTerreno = d.raiosTerreno || 'montanhosa';
      const r = SEARCH_RADIUS_KM[key][d.raiosTerreno];
      d.r25=String(r.p25); d.r50=String(r.p50); d.r75=String(r.p75); d.r95=String(r.p95);
      persist(ficha);
      autoMsg = 'Valores sugeridos pela categoria da Ficha 3. Confira o tipo de terreno e ajuste se necessário.';
    }
  }
  const perfil = d.raiosPerfil || '';
  const terr = d.raiosTerreno || 'montanhosa';
  wrap.innerHTML = `
    <div class="field"><label>Categoria de referência (tabela estatística de raios)</label>
      <select id="raios-perfil">
        <option value="">— selecione —</option>
        ${VICTIM_PROFILES.map(p=>`<option value="${p.key}" ${perfil===p.key?'selected':''}>${escapeHtml(p.label)}</option>`).join('')}
        <option value="OUTROS" ${perfil==='OUTROS'?'selected':''}>Outros (digitar os raios)</option>
      </select></div>
    <div class="field ${(perfil && perfil!=='OUTROS')?'':'hidden'}" id="raios-terr-wrap"><label>Tipo de terreno</label>
      <div class="opt-group">
        <button type="button" class="opt-btn ${terr==='montanhosa'?'active':''}" data-t="montanhosa">Montanhosa</button>
        <button type="button" class="opt-btn ${terr==='plana'?'active':''}" data-t="plana">Não montanhosa</button>
      </div></div>
    <div class="raios-grid">
      ${[['r25','25%','#ff5a5a'],['r50','50%','#e8d24a'],['r75','75%','#4ad8d8'],['r95','95%','#cfcfcf']].map(([k,p,c])=>
        `<div class="field"><label><span style="color:${c}">●</span> Raio ${p} (km)</label><input type="text" inputmode="decimal" data-k="${k}" value="${escapeHtml(d[k]||'')}" placeholder="km"></div>`).join('')}
    </div>
    <div class="field-help">${escapeHtml(autoMsg || 'Preencha com os valores da categoria adotada. O anel de 50% concentra o esforço inicial; o de 95% baliza o limite externo da área. Os valores são editáveis.')}</div>`;
  const fill = ()=>{
    const p = d.raiosPerfil;
    if(p && p!=='OUTROS' && SEARCH_RADIUS_KM[p]){
      const r = SEARCH_RADIUS_KM[p][d.raiosTerreno||'montanhosa'];
      d.r25=String(r.p25); d.r50=String(r.p50); d.r75=String(r.p75); d.r95=String(r.p95);

  wrap.querySelector('#raios-perfil').onchange = (e)=>{
    d.raiosPerfil = e.target.value;
    if(!d.raiosTerreno) d.raiosTerreno = 'montanhosa';
    fill(); persist(ficha); render();
  };
  wrap.querySelectorAll('[data-t]').forEach(b=>{
    b.onclick = ()=>{ d.raiosTerreno = b.dataset.t; fill(); persist(ficha); render(); };
  });
  wrap.querySelectorAll('.raios-grid input').forEach(inp=>{
    inp.oninput = (e)=>{ d[inp.dataset.k] = e.target.value; persist(ficha); };
  });
  return wrap;
}
